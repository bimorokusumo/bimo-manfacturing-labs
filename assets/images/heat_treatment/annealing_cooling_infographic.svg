<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="brickWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="chipSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f8fafc" text-anchor="middle">
    ILUSTRASI BENGKEL: ANNEALING VS NORMALIZING PADA PEMESINAN
  </text>
  <text x="400" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Pendinginan Tungku Tertutup (10-20°C/Jam) vs Pendinginan Udara Terbuka Serta Efeknya Pada Pembubutan CNC
  </text>

  <!-- Left: ANNEALING (Tungku Tertutup 24 Jam ➔ 100% Machinable) -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="310" height="260" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="34" rx="10" fill="#0369a1"/>
    <text x="155" y="22" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🧘 ANNEALING (Tungku Tertutup 24 Jam)
    </text>

    <!-- Closed Brick Oven Graphic -->
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="130" height="85" rx="6" fill="url(#brickWall)" stroke="#b45309" stroke-width="2"/>
      <!-- Heavy Oven Door Locked -->
      <rect x="15" y="10" width="100" height="65" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Lock Bar -->
      <line x1="10" y1="42" x2="120" y2="42" stroke="#ea580c" stroke-width="4"/>
      <circle cx="65" cy="42" r="8" fill="#f59e0b"/>
      <text x="65" y="46" font-size="8" font-weight="900" fill="#78350f" text-anchor="middle">🔒</text>
      <text x="65" y="65" font-size="8" font-weight="800" fill="#fca5a5" text-anchor="middle">Dilarang Buka!</text>

      <!-- Cool-down Gauge -->
      <circle cx="180" cy="40" r="30" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      <text x="180" y="36" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">15°C</text>
      <text x="180" y="50" font-size="8" fill="#94a3b8" text-anchor="middle">per Jam</text>
    </g>

    <!-- CNC Machining Benefit -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="270" height="90" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="900" fill="#7dd3fc">✨ Efek Nyata di Mesin Bubut CNC:</text>
      
      <!-- Smooth Chip Graphic -->
      <path d="M 20,40 Q 40,30 60,45 T 100,35" fill="none" stroke="url(#chipSheen)" stroke-width="4" stroke-linecap="round"/>
      <text x="110" y="42" font-size="9" font-weight="700" fill="#e0f2fe">Tatal Mulus Bergulung Rapi</text>

      <circle cx="18" cy="62" r="3" fill="#4ade80"/>
      <text x="28" y="65" font-size="9" fill="#e0f2fe">Baja paling empuk disayat (Machinability 100%)</text>
      <circle cx="18" cy="78" r="3" fill="#4ade80"/>
      <text x="28" y="81" font-size="9" fill="#e0f2fe">Pahat potong awet tahan 12 jam nonstop</text>
    </g>
  </g>

  <!-- Right: NORMALIZING (Didinginkan di Udara Terbuka ➔ Butir Halus Tangguh) -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="310" height="260" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="34" rx="10" fill="#059669"/>
    <text x="155" y="22" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      🌱 NORMALIZING (Dingin di Udara Terbuka)
    </text>

    <!-- Outdoor Cooling Rack Graphic -->
    <g transform="translate(30, 48)">
      <!-- Wire Cooling Rack -->
      <line x1="10" y1="65" x2="120" y2="65" stroke="#64748b" stroke-width="3"/>
      <line x1="20" y1="65" x2="10" y2="85" stroke="#64748b" stroke-width="2.5"/>
      <line x1="110" y1="65" x2="120" y2="85" stroke="#64748b" stroke-width="2.5"/>
      <!-- Hot Red-Orange Billet on Rack -->
      <rect x="25" y="42" width="80" height="22" rx="3" fill="#ea580c" stroke="#f97316" stroke-width="1.5"/>
      <!-- Heat Waves radiating upwards -->
      <path d="M 40,35 Q 45,25 40,15" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 65,35 Q 70,25 65,15" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 90,35 Q 95,25 90,15" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Gauge -->
      <circle cx="180" cy="40" r="30" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="180" y="34" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">Udara</text>
      <text x="180" y="48" font-size="8" fill="#94a3b8" text-anchor="middle">Tenang</text>
    </g>

    <!-- Structural Toughness Benefit -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="270" height="90" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="900" fill="#a7f3d0">🚆 Efek Struktural di Dunia Nyata:</text>

      <circle cx="18" cy="42" r="3" fill="#facc15"/>
      <text x="28" y="45" font-size="9" fill="#d1fae5">Butir kristal seragam halus (ASTM 8)</text>

      <circle cx="18" cy="62" r="3" fill="#facc15"/>
      <text x="28" y="65" font-size="9" fill="#d1fae5">Kekuatan tarik (Tensile) lebih kuat dari Anneal</text>

      <circle cx="18" cy="78" r="3" fill="#facc15"/>
      <text x="28" y="81" font-size="9" fill="#d1fae5">Wajib untuk: Rel Kereta Api &amp; Crankshaft Kapal</text>
    </g>
  </g>
</svg>
