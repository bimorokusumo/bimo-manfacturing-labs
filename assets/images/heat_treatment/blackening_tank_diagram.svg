<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="tankShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect width="800" height="34" rx="8" fill="url(#headerGrad)"/>
  <rect y="26" width="800" height="8" fill="url(#headerGrad)"/>
  <text x="400" y="22" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">ALUR STANDAR PROSES BLACKENING (HOT BLACK OXIDE) 7 TAHAPAN INDUSTRI</text>

  <!-- Overhead Monorail Hoist Line -->
  <line x1="40" y1="52" x2="760" y2="52" stroke="#475569" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="400" y="47" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Jalur Monorail Keranjang Komponen Logam (Overhead Hoist Basket)</text>

  <!-- Tank 1: Degreaser -->
  <g transform="translate(25, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#0284c7"/>
    <rect y="16" width="95" height="6" fill="#0284c7"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 1: DEGREASING</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#e0f2fe"/>
    <text x="47" y="48" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Alkali Cleaner</text>
    <text x="47" y="60" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">70°C – 80°C</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">5 - 10 Menit</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Angkat lemak &amp;</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">oli dromus bubut</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#0284c7"/>
  </g>

  <!-- Tank 2: Rinse 1 -->
  <g transform="translate(133, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#0ea5e9"/>
    <rect y="16" width="95" height="6" fill="#0ea5e9"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 2: RINSE 1</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#f0f9ff"/>
    <text x="47" y="48" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Air Mengalir</text>
    <text x="47" y="60" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Suhu Ruang</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">Overflow Clean</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Bilas tuntas sisa</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">sabun degreaser</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#38bdf8"/>
  </g>

  <!-- Tank 3: Acid Pickling -->
  <g transform="translate(241, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#f59e0b"/>
    <rect y="16" width="95" height="6" fill="#f59e0b"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 3: PICKLING</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#fef3c7"/>
    <text x="47" y="48" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Asam HCl 10%</text>
    <text x="47" y="60" fill="#d97706" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Suhu Kamar</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">1 - 3 Menit</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Larutkan karat &amp;</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">kerak oksida panas</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#f59e0b"/>
  </g>

  <!-- Tank 4: Rinse 2 -->
  <g transform="translate(349, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#0ea5e9"/>
    <rect y="16" width="95" height="6" fill="#0ea5e9"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 4: RINSE 2</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#f0f9ff"/>
    <text x="47" y="48" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Air Bersih Netral</text>
    <text x="47" y="60" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Suhu Ruang</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">Agitasi Aliran</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Cegah asam masuk</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">ke bak alkali panas</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#38bdf8"/>
  </g>

  <!-- Tank 5: Hot Blackening Bath (CRITICAL) -->
  <g transform="translate(457, 56)" filter="url(#tankShadow)">
    <rect width="105" height="135" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="105" height="24" rx="6" fill="#dc2626"/>
    <rect y="18" width="105" height="6" fill="#dc2626"/>
    <text x="52" y="16" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">BAK 5: BLACKENING</text>
    <rect x="8" y="32" width="89" height="50" rx="3" fill="#fee2e2"/>
    <text x="52" y="48" fill="#991b1b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">NaOH + NaNO₂/NO₃</text>
    <text x="52" y="62" fill="#dc2626" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">140°C – 143°C</text>
    <text x="52" y="73" fill="#b91c1c" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">15 - 30 Menit (Kritis!)</text>
    <text x="52" y="95" fill="#18181b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Reaksi: Fe ➔ Fe₃O₄</text>
    <text x="52" y="107" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Hitam Magnetit Doff</text>
    <rect x="15" y="120" width="75" height="4" rx="2" fill="#18181b"/>
  </g>

  <!-- Tank 6: Rinse 3 -->
  <g transform="translate(574, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#0ea5e9"/>
    <rect y="16" width="95" height="6" fill="#0ea5e9"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 6: RINSE 3</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#f0f9ff"/>
    <text x="47" y="48" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Air Hangat / Dingin</text>
    <text x="47" y="60" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">60°C / Amb.</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">Bilas Kaustik</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Bersihkan sisa garam</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">agar tidak bercak</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#38bdf8"/>
  </g>

  <!-- Tank 7: Rust Preventive Oil Seal -->
  <g transform="translate(681, 62)" filter="url(#tankShadow)">
    <rect width="95" height="125" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="95" height="22" rx="5" fill="#16a34a"/>
    <rect y="16" width="95" height="6" fill="#16a34a"/>
    <text x="47" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BAK 7: SEAL OIL</text>
    <rect x="8" y="32" width="79" height="42" rx="3" fill="#dcfce7"/>
    <text x="47" y="48" fill="#15803d" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Anti-Rust Oil</text>
    <text x="47" y="60" fill="#16a34a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Dewatering</text>
    <text x="47" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">1 - 2 Menit</text>
    <text x="47" y="90" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Kunci pori magnetit</text>
    <text x="47" y="102" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Tahan karat 100%!</text>
    <rect x="15" y="112" width="65" height="3" rx="1.5" fill="#16a34a"/>
  </g>

  <!-- Footer Formula Bar -->
  <g transform="translate(25, 200)">
    <rect width="751" height="28" rx="4" fill="#0f172a"/>
    <text x="375" y="18" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">
      <tspan font-weight="bold" fill="#38bdf8">Reaksi Kimia Inti:</tspan> 
      3 Fe + NaNO₂ + 5 NaOH ➔ 3 Na₂FeO₂ + NH₃ + H₂O  ➔  <tspan font-weight="bold" fill="#4ade80">Fe₃O₄ (Black Magnetite Layer, tebal 1.5 µm, Toleransi 0.000 mm)</tspan>
    </text>
  </g>
</svg>
