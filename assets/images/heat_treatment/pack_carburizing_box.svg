<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <radialGradient id="carbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f8fafc" text-anchor="middle">
    ILUSTRASI BENGKEL: KOTAK PACK CARBURIZING (PENGURUSAN KULIT)
  </text>
  <text x="400" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Benda Kerja Dibakar Bersama Arang &amp; BaCO₃ Dalam Kotak Kedap Udara 920°C Selama 4-8 Jam
  </text>

  <!-- Left: The Sealed Carburizing Box Cutaway -->
  <g transform="translate(60, 70)">
    <!-- Box Frame (Heavy Steel Box) -->
    <rect x="0" y="20" width="360" height="240" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    
    <!-- Fire Clay Sealant on Rim -->
    <rect x="-10" y="10" width="380" height="18" rx="4" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
    <text x="180" y="23" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
      Lempung Tahan Api (Fire Clay Sealant) - Kedap Udara!
    </text>

    <!-- Charcoal Bed Interior -->
    <rect x="15" y="40" width="330" height="205" rx="4" fill="url(#charcoalGrad)"/>

    <!-- Charcoal Pellets Scatter (Dots) -->
    <g fill="#404040" opacity="0.6">
      <circle cx="35" cy="60" r="5"/><circle cx="55" cy="75" r="4"/><circle cx="80" cy="55" r="6"/>
      <circle cx="120" cy="65" r="5"/><circle cx="280" cy="60" r="5"/><circle cx="310" cy="80" r="6"/>
      <circle cx="45" cy="180" r="5"/><circle cx="70" cy="200" r="6"/><circle cx="300" cy="210" r="5"/>
      <circle cx="320" cy="170" r="4"/><circle cx="40" cy="225" r="5"/><circle cx="280" cy="225" r="6"/>
    </g>

    <!-- Heat Glow Aura around workpiece -->
    <circle cx="180" cy="140" r="90" fill="url(#carbonGlow)"/>

    <!-- Gear Workpiece inside the box -->
    <g transform="translate(180, 140)">
      <!-- Outer teeth (Hardened skin by carbon diffusion) -->
      <circle cx="0" cy="0" r="55" fill="#ef4444" stroke="#f97316" stroke-width="2"/>
      <!-- Inner tough core -->
      <circle cx="0" cy="0" r="42" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <text x="0" y="4" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">RODA GIGI</text>
    </g>

    <!-- Carbon Atoms Diffusion Arrows -->
    <g stroke="#facc15" stroke-width="1.5" fill="#facc15">
      <line x1="90" y1="140" x2="120" y2="140"/>
      <polygon points="120,137 126,140 120,143"/>

      <line x1="270" y1="140" x2="240" y2="140"/>
      <polygon points="240,137 234,140 240,143"/>

      <line x1="180" y1="65" x2="180" y2="85"/>
      <polygon points="177,85 180,91 183,85"/>

      <line x1="180" y1="215" x2="180" y2="195"/>
      <polygon points="177,195 180,189 183,195"/>
    </g>

    <!-- Callout on carbon atoms -->
    <rect x="70" y="110" width="70" height="20" rx="4" fill="#0f172a" stroke="#facc15"/>
    <text x="105" y="124" font-size="9" font-weight="800" fill="#facc15" text-anchor="middle">Atom C Masuk</text>
  </g>

  <!-- Right: Technical Infographic Points -->
  <g transform="translate(460, 75)">
    <rect x="0" y="0" width="290" height="255" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="145" y="24" font-size="12" font-weight="900" fill="#f8fafc" text-anchor="middle">
      KUNCI TEKNIS PACK CARBURIZING
    </text>

    <!-- Point 1 -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="260" height="42" rx="6" fill="#1e293b"/>
      <text x="10" y="16" font-size="10" font-weight="800" fill="#f97316">🔥 Suhu: 900°C - 930°C</text>
      <text x="10" y="32" font-size="9" fill="#cbd5e1">Baja dalam fasa austenit FCC mampu serap karbon</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(15, 95)">
      <rect x="0" y="0" width="260" height="42" rx="6" fill="#1e293b"/>
      <text x="10" y="16" font-size="10" font-weight="800" fill="#38bdf8">🪵 Media: Arang 80% + BaCO₃ 20%</text>
      <text x="10" y="32" font-size="9" fill="#cbd5e1">BaCO₃ melepas gas CO sebagai pembawa karbon</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="260" height="42" rx="6" fill="#1e293b"/>
      <text x="10" y="16" font-size="10" font-weight="800" fill="#4ade80">⏱️ Laju Penetrasi: 0.2 mm / jam</text>
      <text x="10" y="32" font-size="9" fill="#cbd5e1">Waktu 4 jam ➔ Menghasilkan tebal kulit ~0.8 mm</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="260" height="46" rx="6" fill="#7f1d1d"/>
      <text x="10" y="17" font-size="10" font-weight="900" fill="#fef08a">⚡ Hasil Akhir Pasca-Quench:</text>
      <text x="10" y="35" font-size="9" font-weight="700" fill="#ffffff">Kulit 62 HRC (Anti-Aus) • Inti 30 HRC (Anti-Patah)</text>
    </g>
  </g>
</svg>
