<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" height="100%">
  <!-- Background -->
  <rect width="740" height="220" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="370" y="24" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">SKALA VISUAL SUHU &amp; WARNA PIJAR BAJA DI DALAM TUNGKU (INCANDESCENCE SCALE)</text>
  <text x="370" y="40" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Digunakan teknisi bengkel untuk memperkirakan temperatur pemanasan hardening &amp; forging secara visual</text>

  <!-- Color Swatches Grid -->
  <g transform="translate(20, 55)">
    <!-- 550°C Faint Red -->
    <g transform="translate(0, 0)">
      <rect width="90" height="75" rx="5" fill="#450a0a" stroke="#7f1d1d" stroke-width="1.5"/>
      <circle cx="45" cy="32" r="16" fill="#7f1d1d"/>
      <text x="45" y="65" fill="#fecaca" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">550°C</text>
      <text x="45" y="95" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Merah Redup</text>
      <text x="45" y="107" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Faint Red)</text>
      <text x="45" y="125" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.8" text-anchor="middle">Awal pijar gelap</text>
    </g>

    <!-- 650°C Blood Red -->
    <g transform="translate(102, 0)">
      <rect width="90" height="75" rx="5" fill="#7f1d1d" stroke="#991b1b" stroke-width="1.5"/>
      <circle cx="45" cy="32" r="16" fill="#b91c1c"/>
      <text x="45" y="65" fill="#fee2e2" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">650°C</text>
      <text x="45" y="95" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Merah Darah</text>
      <text x="45" y="107" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Blood Red)</text>
      <text x="45" y="125" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.8" text-anchor="middle">Stress relief baja</text>
    </g>

    <!-- 780°C Cherry Red (CRITICAL HARDENING) -->
    <g transform="translate(204, -5)">
      <rect width="90" height="85" rx="5" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
      <circle cx="45" cy="36" r="18" fill="#dc2626"/>
      <text x="45" y="72" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">780°C</text>
      <text x="45" y="104" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Merah Ceri</text>
      <text x="45" y="116" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Cherry Red)</text>
      <text x="45" y="133" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Hardening SK5</text>
    </g>

    <!-- 850°C Bright Cherry Red -->
    <g transform="translate(306, -5)">
      <rect width="90" height="85" rx="5" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
      <circle cx="45" cy="36" r="18" fill="#ea580c"/>
      <text x="45" y="72" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">850°C</text>
      <text x="45" y="104" fill="#fb923c" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Merah Terang</text>
      <text x="45" y="116" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Bright Cherry)</text>
      <text x="45" y="133" fill="#fdba74" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Hardening S45C</text>
    </g>

    <!-- 950°C Bright Orange -->
    <g transform="translate(408, 0)">
      <rect width="90" height="75" rx="5" fill="#c2410c" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="45" cy="32" r="16" fill="#f97316"/>
      <text x="45" y="65" fill="#ffedd5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">950°C</text>
      <text x="45" y="95" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Oranye Cerah</text>
      <text x="45" y="107" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Bright Orange)</text>
      <text x="45" y="125" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.8" text-anchor="middle">Carburizing pack</text>
    </g>

    <!-- 1050°C Yellow -->
    <g transform="translate(510, 0)">
      <rect width="90" height="75" rx="5" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="45" cy="32" r="16" fill="#fbbf24"/>
      <text x="45" y="65" fill="#fef3c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">1050°C</text>
      <text x="45" y="95" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Kuning Emas</text>
      <text x="45" y="107" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(Dark Yellow)</text>
      <text x="45" y="125" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.8" text-anchor="middle">Hardening D2 Tool</text>
    </g>

    <!-- 1200°C White -->
    <g transform="translate(612, 0)">
      <rect width="88" height="75" rx="5" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="44" cy="32" r="16" fill="#ffffff"/>
      <text x="44" y="65" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" text-anchor="middle">1200°C</text>
      <text x="44" y="95" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Putih Pijar</text>
      <text x="44" y="107" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">(White Heat)</text>
      <text x="44" y="125" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.8" text-anchor="middle">Penempaan (Forging)</text>
    </g>
  </g>

  <!-- Notice -->
  <rect x="20" y="195" width="700" height="18" rx="3" fill="#1e293b"/>
  <text x="370" y="208" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="bold">Kaidah Praktis Bengkel:</tspan> Pengecekan visual warna wajib dilakukan di area teduh redup tungku (hindari cahaya terik matahari langsung yang membiaskan warna).
  </text>
</svg>
