<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="beamSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f8fafc" text-anchor="middle">
    KESETIMBANGAN STATIS &amp; REAKSI TUMPUAN BALOK (EQUILIBRIUM)
  </text>
  <text x="400" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Syarat Statika Struktur: ΣFx = 0, ΣFy = 0, ΣM = 0 ➔ Menghitung Beban Pada Pondasi Crane &amp; Kolom Bengkel
  </text>

  <!-- Beam Diagram Graphic -->
  <g transform="translate(80, 85)">
    <!-- Dimension line across whole beam (L = 6 meter) -->
    <line x1="60" y1="25" x2="580" y2="25" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="18" x2="60" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="580" y1="18" x2="580" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="320" y="20" font-size="11" font-weight="900" fill="#cbd5e1" text-anchor="middle">Panjang Balok L = 6.0 Meter</text>

    <!-- The Steel I-Beam -->
    <rect x="50" y="45" width="540" height="24" rx="3" fill="url(#beamSteel)" stroke="#64748b" stroke-width="2"/>
    <!-- Center Flange line -->
    <line x1="50" y1="57" x2="590" y2="57" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4"/>

    <!-- Concentrated Load P = 1200 N at x = 2.0 meter from A (x = 60 + 173 = 233) -->
    <g transform="translate(230, -5)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#ef4444" stroke-width="5"/>
      <polygon points="-8,38 0,48 8,38" fill="#ef4444"/>
      <rect x="-45" y="-30" width="90" height="28" rx="4" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="0" y="-12" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">P = 1.200 N</text>
      <!-- Dimension distance a = 2m -->
      <text x="0" y="65" font-size="10" font-weight="800" fill="#fca5a5" text-anchor="middle">x = 2.0 m</text>
    </g>

    <!-- Support A: Tumpuan Sendi (Pin Support) at x = 60 -->
    <g transform="translate(60, 69)">
      <polygon points="0,0 -16,28 16,28" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <!-- Foundation ground hatch -->
      <line x1="-24" y1="28" x2="24" y2="28" stroke="#64748b" stroke-width="2"/>
      <line x1="-20" y1="34" x2="-14" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="-8" y1="34" x2="-2" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="4" y1="34" x2="10" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="16" y1="34" x2="22" y2="28" stroke="#64748b" stroke-width="1.5"/>

      <text x="0" y="48" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle">Tumpuan Sendi A</text>

      <!-- Upward Reaction Vector R_A -->
      <line x1="0" y1="120" x2="0" y2="65" stroke="#10b981" stroke-width="4"/>
      <polygon points="-6,72 0,60 6,72" fill="#10b981"/>
      <rect x="-50" y="125" width="100" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="0" y="142" font-size="11" font-weight="900" fill="#a7f3d0" text-anchor="middle">RA = 800 N</text>
    </g>

    <!-- Support B: Tumpuan Rol (Roller Support) at x = 580 -->
    <g transform="translate(580, 69)">
      <polygon points="0,0 -16,20 16,20" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      <!-- Rollers (2 circles) -->
      <circle cx="-8" cy="24" r="4" fill="#cbd5e1"/>
      <circle cx="8" cy="24" r="4" fill="#cbd5e1"/>
      <!-- Ground line -->
      <line x1="-24" y1="28" x2="24" y2="28" stroke="#64748b" stroke-width="2"/>
      <line x1="-20" y1="34" x2="-14" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="-8" y1="34" x2="-2" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="4" y1="34" x2="10" y2="28" stroke="#64748b" stroke-width="1.5"/>
      <line x1="16" y1="34" x2="22" y2="28" stroke="#64748b" stroke-width="1.5"/>

      <text x="0" y="48" font-size="11" font-weight="900" fill="#fbbf24" text-anchor="middle">Tumpuan Rol B</text>

      <!-- Upward Reaction Vector R_B -->
      <line x1="0" y1="120" x2="0" y2="65" stroke="#10b981" stroke-width="4"/>
      <polygon points="-6,72 0,60 6,72" fill="#10b981"/>
      <rect x="-50" y="125" width="100" height="26" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="0" y="142" font-size="11" font-weight="900" fill="#a7f3d0" text-anchor="middle">RB = 400 N</text>
    </g>
  </g>

  <!-- Bottom Calculation Summary Box -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="680" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="22" font-size="11" font-weight="900" fill="#facc15">
      🧠 CARA HITUNG CEPAT REAKSI TUMPUAN:
    </text>
    <text x="20" y="38" font-size="9.5" fill="#cbd5e1">
      ΣMB = 0 ➔ RA × 6m - 1200N × (6 - 2m) = 0 ➔ <tspan font-weight="bold" fill="#34d399">RA = 800 N</tspan>. Maka <tspan font-weight="bold" fill="#34d399">RB = 1200 - 800 = 400 N</tspan>. Beban lebih dekat ke A, maka tumpuan A menahan beban 2x lebih besar!
    </text>
  </g>
</svg>
