<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="360" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f8fafc" text-anchor="middle">
    KURVA TEGANGAN-REGANGAN BAJA (STRESS-STRAIN DIAGRAM)
  </text>
  <text x="400" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Mengapa Baut Tidak Boleh Dikencangkan Berlebihan? Transisi dari Batas Elastis ke Deformasi Plastis &amp; Patah
  </text>

  <!-- Left: The Graph -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="420" height="260" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Y Axis: Stress / Tegangan (σ) in MPa -->
    <line x1="50" y1="20" x2="50" y2="220" stroke="#64748b" stroke-width="2"/>
    <text x="40" y="25" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="end">Tegangan σ (MPa)</text>
    <polygon points="50,15 46,23 54,23" fill="#64748b"/>

    <!-- X Axis: Strain / Regangan (ε) -->
    <line x1="50" y1="220" x2="390" y2="220" stroke="#64748b" stroke-width="2"/>
    <text x="390" y="240" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="end">Regangan ε (Pertambahan Panjang)</text>
    <polygon points="395,220 387,216 387,224" fill="#64748b"/>

    <!-- Elastic Zone Shaded Area -->
    <polygon points="50,220 130,120 130,220" fill="#10b981" opacity="0.15"/>
    <!-- Plastic Zone Shaded Area -->
    <polygon points="130,220 130,120 280,60 360,110 360,220" fill="#f59e0b" opacity="0.1"/>

    <!-- The Stress-Strain Curve -->
    <path d="M 50,220 
             L 125,120 
             Q 135,125 150,120 
             C 200,80 250,55 285,55 
             C 320,55 340,85 365,115" 
          fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Points on Curve -->
    <!-- Point A: Proportional / Elastic Limit -->
    <circle cx="125" cy="120" r="5" fill="#10b981"/>
    <line x1="125" y1="120" x2="125" y2="220" stroke="#10b981" stroke-dasharray="3,3"/>
    <text x="120" y="110" font-size="9" font-weight="800" fill="#34d399" text-anchor="end">Batas Elastis</text>

    <!-- Point B: Yield Point (Luluh) -->
    <circle cx="150" cy="120" r="5" fill="#facc15"/>
    <text x="160" y="138" font-size="9" font-weight="800" fill="#facc15">Titik Luluh (Yield)</text>

    <!-- Point C: UTS (Tegangan Maksimum) -->
    <circle cx="285" cy="55" r="5" fill="#ef4444"/>
    <text x="285" y="45" font-size="10" font-weight="900" fill="#f87171" text-anchor="middle">UTS (Tarik Maks)</text>

    <!-- Point D: Fracture Point (Patah) -->
    <circle cx="365" cy="115" r="5" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="365" y="132" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">💥 PATAH!</text>
  </g>

  <!-- Right: Explanatory Badges -->
  <g transform="translate(500, 70)">
    <rect x="0" y="0" width="260" height="260" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="130" y="24" font-size="12" font-weight="900" fill="#f8fafc" text-anchor="middle">
      TAHAPAN DEFORMASI LOGAM
    </text>

    <!-- Stage 1 -->
    <g transform="translate(15, 42)">
      <rect x="0" y="0" width="230" height="46" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="10" font-weight="900" fill="#a7f3d0">1. Zona Elastis (Aman)</text>
      <text x="10" y="32" font-size="8.5" fill="#d1fae5">Baja meregang tapi kembali ke panjang asli jika beban dilepas (Hukum Hooke).</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(15, 96)">
      <rect x="0" y="0" width="230" height="46" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="16" font-size="10" font-weight="900" fill="#fde68a">2. Zona Plastis (Bengkok Permanen)</text>
      <text x="10" y="32" font-size="8.5" fill="#fef3c7">Melewati batas luluh: Logam mulur molor dan tidak bisa kembali seperti semula!</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(15, 150)">
      <rect x="0" y="0" width="230" height="46" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="16" font-size="10" font-weight="900" fill="#fecaca">3. Necking (Penyempitan)</text>
      <text x="10" y="32" font-size="8.5" fill="#fee2e2">Penampang batang mengecil kurus di satu titik sebelum akhirnya putus terbelah.</text>
    </g>

    <!-- Warning Note -->
    <g transform="translate(15, 204)">
      <rect x="0" y="0" width="230" height="46" rx="6" fill="#1e293b"/>
      <text x="10" y="16" font-size="9" font-weight="800" fill="#38bdf8">💡 Standar Kunci Torsi Bengkel:</text>
      <text x="10" y="32" font-size="8" fill="#cbd5e1">Baut harus dikencangkan di ZONA ELASTIS (70-80% Yield) agar tidak kendor / patah.</text>
    </g>
  </g>
</svg>
