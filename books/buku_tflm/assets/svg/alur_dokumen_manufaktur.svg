<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="step1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="720" height="30" rx="8" fill="#0f172a"/>
  <rect x="0" y="22" width="720" height="8" fill="#0f172a"/>
  <text x="360" y="20" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">HIRARKI ALUR DOKUMEN REKAYASA &amp; MANUFAKTUR FABRIKASI LOGAM</text>

  <!-- Flow Connector Line -->
  <line x1="75" y1="110" x2="645" y2="110" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Step 1: Kontrak & Spek -->
  <g transform="translate(16, 44)" filter="url(#cardShadow)">
    <rect width="124" height="135" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="124" height="28" rx="8" fill="url(#step1)"/>
    <rect y="20" width="124" height="8" fill="url(#step1)"/>
    <circle cx="62" cy="14" r="10" fill="#ffffff"/>
    <text x="62" y="18" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <text x="62" y="46" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Dokumen Kontrak</text>
    <text x="62" y="58" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">&amp; Spesifikasi Klien</text>
    <rect x="12" y="68" width="100" height="1" fill="#e2e8f0"/>
    <text x="62" y="82" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Persyaratan fungsi,</text>
    <text x="62" y="94" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">standar SNI/AWS,</text>
    <text x="62" y="106" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">jadwal &amp; kuantitas.</text>
    <rect x="22" y="118" width="80" height="4" rx="2" fill="#0284c7"/>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="147,106 155,110 147,114" fill="#0284c7"/>

  <!-- Step 2: Gambar Kerja -->
  <g transform="translate(160, 44)" filter="url(#cardShadow)">
    <rect width="124" height="135" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="124" height="28" rx="8" fill="url(#step2)"/>
    <rect y="20" width="124" height="8" fill="url(#step2)"/>
    <circle cx="62" cy="14" r="10" fill="#ffffff"/>
    <text x="62" y="18" fill="#1d4ed8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <text x="62" y="46" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Gambar Kerja</text>
    <text x="62" y="58" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">(Engineering Drawing)</text>
    <rect x="12" y="68" width="100" height="1" fill="#e2e8f0"/>
    <text x="62" y="82" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Proyeksi ortogonal,</text>
    <text x="62" y="94" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">simbol las ISO 2553,</text>
    <text x="62" y="106" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">toleransi ukuran mm.</text>
    <rect x="22" y="118" width="80" height="4" rx="2" fill="#2563eb"/>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="291,106 299,110 291,114" fill="#2563eb"/>

  <!-- Step 3: Work Order -->
  <g transform="translate(304, 44)" filter="url(#cardShadow)">
    <rect width="124" height="135" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="124" height="28" rx="8" fill="url(#step3)"/>
    <rect y="20" width="124" height="8" fill="url(#step3)"/>
    <circle cx="62" cy="14" r="10" fill="#ffffff"/>
    <text x="62" y="18" fill="#6d28d9" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="62" y="46" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Work Order (WO)</text>
    <text x="62" y="58" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">&amp; Bill of Materials (BOM)</text>
    <rect x="12" y="68" width="100" height="1" fill="#e2e8f0"/>
    <text x="62" y="82" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Otorisasi bengkel,</text>
    <text x="62" y="94" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">alokasi bahan baku,</text>
    <text x="62" y="106" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">perkiraan jam mesin.</text>
    <rect x="22" y="118" width="80" height="4" rx="2" fill="#7c3aed"/>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="435,106 443,110 435,114" fill="#7c3aed"/>

  <!-- Step 4: Job Sheet -->
  <g transform="translate(448, 44)" filter="url(#cardShadow)">
    <rect width="124" height="135" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect width="124" height="28" rx="8" fill="url(#step4)"/>
    <rect y="20" width="124" height="8" fill="url(#step4)"/>
    <circle cx="62" cy="14" r="10" fill="#ffffff"/>
    <text x="62" y="18" fill="#047857" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <text x="62" y="46" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Job Sheet Praktik</text>
    <text x="62" y="58" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">(Instruksi Kerja Mandiri)</text>
    <rect x="12" y="68" width="100" height="1" fill="#e2e8f0"/>
    <text x="62" y="82" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Langkah demi langkah,</text>
    <text x="62" y="94" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">parameter arus &amp; APD,</text>
    <text x="62" y="106" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">lembar cek ukuran.</text>
    <rect x="22" y="118" width="80" height="4" rx="2" fill="#059669"/>
  </g>

  <!-- Arrow 4 -> 5 -->
  <polygon points="579,106 587,110 579,114" fill="#059669"/>

  <!-- Step 5: QC Report -->
  <g transform="translate(592, 44)" filter="url(#cardShadow)">
    <rect width="112" height="135" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="112" height="28" rx="8" fill="url(#step5)"/>
    <rect y="20" width="112" height="8" fill="url(#step5)"/>
    <circle cx="56" cy="14" r="10" fill="#ffffff"/>
    <text x="56" y="18" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5</text>
    <text x="56" y="46" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Laporan QC / Mutu</text>
    <text x="56" y="58" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">(Inspection Report)</text>
    <rect x="10" y="68" width="92" height="1" fill="#e2e8f0"/>
    <text x="56" y="82" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Uji visual &amp; NDT,</text>
    <text x="56" y="94" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">verifikasi dimensi,</text>
    <text x="56" y="106" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">approval produk lolos.</text>
    <rect x="18" y="118" width="76" height="4" rx="2" fill="#d97706"/>
  </g>
</svg>
