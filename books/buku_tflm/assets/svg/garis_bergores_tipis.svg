<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="360" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="360" height="32" rx="8" fill="#1e293b"/>
  <rect x="0" y="24" width="360" height="8" fill="#1e293b"/>
  <text x="180" y="21" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">GARIS BERGORES TIPIS (STRIP-TITIK)</text>

  <!-- Specimen Line Demonstration -->
  <g transform="translate(25, 45)">
    <rect width="310" height="42" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Spesimen Garis Acuan:</text>
    <line x1="15" y1="28" x2="210" y2="28" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="14 3 2 3"/>
    <rect x="225" y="16" width="72" height="20" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="261" y="30" fill="#dc2626" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">0.25 – 0.35 mm</text>
  </g>

  <!-- Engineering Drawing Part Example -->
  <g transform="translate(25, 96)">
    <rect width="310" height="92" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Cylindrical Shaft / Flange with center circle -->
    <circle cx="85" cy="46" r="34" fill="#f8fafc" stroke="#334155" stroke-width="2.2"/>
    <circle cx="85" cy="46" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    
    <!-- Long-Dash-Dot Center Lines extending past the boundary by 3-5 mm -->
    <line x1="40" y1="46" x2="130" y2="46" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="12 3 2 3"/>
    <line x1="85" y1="4" x2="85" y2="88" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="12 3 2 3"/>
    
    <!-- Center mark cross at origin -->
    <line x1="82" y1="46" x2="88" y2="46" stroke="#dc2626" stroke-width="1.8"/>
    <line x1="85" y1="43" x2="85" y2="49" stroke="#dc2626" stroke-width="1.8"/>

    <!-- Annotations with Arrow -->
    <path d="M 175 30 L 132 30" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="130" cy="46" r="3" fill="#dc2626"/>
    <text x="180" y="30" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">Sumbu Simetri Poros</text>
    <text x="180" y="44" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Pusat lingkaran lubang bor &amp; poros</text>

    <text x="180" y="64" fill="#b91c1c" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Pola Strip Panjang - Titik</text>
    <text x="180" y="77" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Melewati tepi benda sejauh 3–5 mm</text>
  </g>
</svg>
