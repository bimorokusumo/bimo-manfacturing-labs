<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="540" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="540" height="32" rx="8" fill="#0f172a"/>
  <rect x="0" y="24" width="540" height="8" fill="#0f172a"/>
  <text x="270" y="21" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">PRINSIP FISIKA PROSES PENGELASAN SMAW (SHIELDED METAL ARC)</text>

  <!-- Base Metal (Plat Baja) -->
  <rect x="50" y="200" width="440" height="70" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="75" y="240" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">Logam Induk (Base Metal)</text>

  <!-- Penetration crater & Molten Pool -->
  <path d="M 200 200 Q 275 235 340 200 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  
  <!-- Solidified weld metal (Logam Las Beku) -->
  <path d="M 120 200 Q 160 192 200 200 Q 160 215 120 200 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <!-- Weld ripples -->
  <path d="M 135 196 Q 145 200 135 204" stroke="#475569" stroke-width="1.2" fill="none"/>
  <path d="M 155 195 Q 165 200 155 205" stroke="#475569" stroke-width="1.2" fill="none"/>
  <path d="M 175 195 Q 185 200 175 205" stroke="#475569" stroke-width="1.2" fill="none"/>

  <!-- Slag layer (Lapisan Terak) -->
  <path d="M 120 199 Q 160 190 200 198 Q 205 195 210 198 L 210 195 Q 160 187 120 196 Z" fill="#78350f" stroke="#451a03" stroke-width="1"/>

  <!-- Shielding Gas Cloud -->
  <ellipse cx="270" cy="170" rx="90" ry="45" fill="#38bdf8" opacity="0.22"/>
  <ellipse cx="270" cy="175" rx="75" ry="35" fill="#bae6fd" opacity="0.3"/>

  <!-- Arc Flame / Plasma Core -->
  <polygon points="255,150 285,150 305,202 235,202" fill="#f59e0b" opacity="0.85"/>
  <polygon points="262,150 278,150 290,200 250,200" fill="#fef08a" opacity="0.95"/>
  <!-- Molten droplet transfer -->
  <circle cx="270" cy="172" r="3.5" fill="#dc2626"/>
  <circle cx="267" cy="186" r="4" fill="#ea580c"/>

  <!-- Electrode Assembly (Angled ~70-80°) -->
  <g transform="translate(245, 45)">
    <!-- Flux Coating -->
    <rect x="0" y="0" width="50" height="105" rx="2" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="25" y="55" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 25 55)">Salutan Fluks</text>
    
    <!-- Core Wire -->
    <rect x="18" y="-15" width="14" height="120" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <text x="25" y="30" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 25 30)">Kawat Inti</text>
  </g>

  <!-- Labels & Pointers -->
  <!-- Label: Salutan Fluks -->
  <line x1="300" y1="80" x2="390" y2="60" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="390" cy="60" r="2.5" fill="#0284c7"/>
  <text x="395" y="63" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Salutan Fluks (Flux Coating)</text>

  <!-- Label: Kawat Inti -->
  <line x1="265" y1="40" x2="350" y2="40" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="350" cy="40" r="2.5" fill="#0284c7"/>
  <text x="355" y="43" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Kawat Inti Baja (Core Wire)</text>

  <!-- Label: Gas Pelindung -->
  <line x1="355" y1="165" x2="415" y2="145" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="415" cy="145" r="2.5" fill="#0284c7"/>
  <text x="420" y="148" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Gas Pelindung (Shielding Gas)</text>

  <!-- Label: Busur Plasma Panas -->
  <line x1="290" y1="180" x2="415" y2="180" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="415" cy="180" r="2.5" fill="#dc2626"/>
  <text x="420" y="183" fill="#b91c1c" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Busur Nyala Plasma (3.000–6.000°C)</text>

  <!-- Label: Kawah Las Cair -->
  <line x1="270" y1="215" x2="370" y2="285" stroke="#ea580c" stroke-width="1.2"/>
  <circle cx="370" cy="285" r="2.5" fill="#ea580c"/>
  <text x="375" y="288" fill="#c2410c" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Kawah Las Cair (Molten Weld Pool)</text>

  <!-- Label: Lapisan Terak -->
  <line x1="160" y1="192" x2="90" y2="120" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="90" cy="120" r="2.5" fill="#78350f"/>
  <text x="15" y="115" fill="#78350f" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Lapisan Terak Pelindung (Slag)</text>

  <!-- Label: Logam Las Beku -->
  <line x1="160" y1="205" x2="80" y2="160" stroke="#334155" stroke-width="1.2"/>
  <circle cx="80" cy="160" r="2.5" fill="#334155"/>
  <text x="15" y="155" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Logam Las Beku (Solidified Weld)</text>

  <!-- Direction of Travel Indicator -->
  <g transform="translate(180, 290)">
    <line x1="0" y1="10" x2="80" y2="10" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="80,6 90,10 80,14" fill="#2563eb"/>
    <text x="45" y="0" fill="#1e40af" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Arah Pengelasan (Travel)</text>
  </g>
</svg>
