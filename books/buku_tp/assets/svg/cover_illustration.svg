<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#fcbf49"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Cyber Circuit Lines -->
  <path d="M 50 250 L 150 250 L 200 320 L 350 320 M 650 150 L 580 220 L 450 220" fill="none" stroke="rgba(0,180,216,0.3)" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="320" r="4" fill="#00b4d8"/>
  <circle cx="580" cy="220" r="4" fill="#f77f00"/>
  
  <!-- Central Big Gear -->
  <g transform="translate(400,250)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(72,202,228,0.15)" stroke-width="18" stroke-dasharray="12 8"/>
    <!-- Gear teeth -->
    <g fill="url(#gearGrad)" filter="url(#glow)">
      <circle cx="0" cy="0" r="110" opacity="0.15" fill="#00b4d8"/>
      <path d="M-20,-100 L20,-100 L15,-80 L-15,-80 Z M-20,100 L20,100 L15,80 L-15,80 Z M-100,-20 L-100,20 L-80,15 L-80,-15 Z M100,-20 L100,20 L80,15 L80,-15 Z" />
      <path d="M-70,-70 L-42,-98 L-30,-75 L-55,-50 Z M70,70 L42,98 L30,75 L55,50 Z M-70,70 L-98,42 L-75,30 L-50,55 Z M70,-70 L98,-42 L75,-30 L50,-55 Z" />
      <circle cx="0" cy="0" r="70" fill="none" stroke="#48cae4" stroke-width="6"/>
      <circle cx="0" cy="0" r="35" fill="#0a192f" stroke="#f77f00" stroke-width="5"/>
      <circle cx="0" cy="0" r="12" fill="#f77f00"/>
    </g>
    <!-- Secondary Gear -->
    <g transform="translate(150,-100)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#fcbf49" stroke-width="5" stroke-dasharray="8 6"/>
      <circle cx="0" cy="0" r="20" fill="#112240" stroke="#fcbf49" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#fcbf49"/>
    </g>
    <!-- Tertiary Gear -->
    <g transform="translate(-150,110)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#00b4d8" stroke-width="4" stroke-dasharray="6 4"/>
      <circle cx="0" cy="0" r="16" fill="#112240" stroke="#00b4d8" stroke-width="3"/>
    </g>
  </g>

  <!-- Vernier Caliper Silhouette in upper area -->
  <path d="M 180 90 L 620 90 L 620 115 L 260 115 L 240 160 L 220 160 L 230 115 L 180 115 Z" fill="rgba(255,255,255,0.12)"/>

  <!-- Glowing Badges / Floating Elements -->
  <g transform="translate(120, 160)">
    <rect width="150" height="55" rx="10" fill="rgba(17,34,64,0.85)" stroke="#00b4d8" stroke-width="1.5"/>
    <text x="20" y="24" fill="#48cae4" font-family="sans-serif" font-size="11" font-weight="bold">SMART FACTORY</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">IoT &amp; AI Driven</text>
  </g>
  <g transform="translate(530, 310)">
    <rect width="170" height="55" rx="10" fill="rgba(17,34,64,0.85)" stroke="#f77f00" stroke-width="1.5"/>
    <text x="20" y="24" fill="#fcbf49" font-family="sans-serif" font-size="11" font-weight="bold">STANDAR DUDI</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Presisi Tinggi</text>
  </g>
</svg>