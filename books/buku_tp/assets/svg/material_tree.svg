<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <rect width="850" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="425" y="26" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">POHON KLASIFIKASI MATERIAL TEKNIK (MATERIALS SCIENCE)</text>

  <!-- Root -->
  <rect x="330" y="45" width="190" height="36" rx="6" fill="#1e293b"/>
  <text x="425" y="68" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">MATERIAL TEKNIK</text>

  <!-- Branch 1: Logam -->
  <line x1="425" y1="81" x2="220" y2="110" stroke="#64748b" stroke-width="2"/>
  <rect x="130" y="110" width="180" height="35" rx="6" fill="#2563eb"/>
  <text x="220" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">1. BAHAN LOGAM</text>

  <!-- Sub Logam: Ferro &amp; Non-Ferro -->
  <line x1="220" y1="145" x2="120" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="175" width="180" height="110" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="196" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="12" font-weight="bold">Logam Ferro (Mengandung Fe)</text>
  <text x="120" y="216" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Baja Karbon (Rendah, Sedang, Tinggi)</text>
  <text x="120" y="234" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Baja Paduan (Stainless Steel, HSS)</text>
  <text x="120" y="252" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Besi Tuang (Kelabu, Nodular)</text>

  <line x1="220" y1="145" x2="300" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="220" y="175" width="170" height="110" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="305" y="196" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold">Logam Non-Ferro (Tanpa Fe)</text>
  <text x="305" y="216" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Aluminium (Al) &amp; Paduannya</text>
  <text x="305" y="234" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Tembaga (Cu), Kuningan, Perunggu</text>
  <text x="305" y="252" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">• Nikel, Titanium, Seng (Zn)</text>

  <!-- Branch 2: Non-Logam -->
  <line x1="425" y1="81" x2="630" y2="110" stroke="#64748b" stroke-width="2"/>
  <rect x="540" y="110" width="180" height="35" rx="6" fill="#0d9488"/>
  <text x="630" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">2. BAHAN NON-LOGAM</text>

  <!-- Sub Non Logam: Polimer, Keramik, Komposit -->
  <line x1="630" y1="145" x2="470" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="410" y="175" width="125" height="110" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="472" y="196" text-anchor="middle" fill="#a21caf" font-family="sans-serif" font-size="12" font-weight="bold">Polimer</text>
  <text x="472" y="216" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Termoplastik (PVC, PE)</text>
  <text x="472" y="232" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Termoset (Bakelit)</text>
  <text x="472" y="248" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Elastomer (Karet)</text>

  <line x1="630" y1="145" x2="610" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="550" y="175" width="125" height="110" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="612" y="196" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="bold">Keramik</text>
  <text x="612" y="216" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Tahan Panas Ekstrem</text>
  <text x="612" y="232" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Keras &amp; Getas</text>
  <text x="612" y="248" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Karbida Insert Bubut</text>

  <line x1="630" y1="145" x2="750" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="690" y="175" width="135" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="757" y="196" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="12" font-weight="bold">Komposit</text>
  <text x="757" y="216" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Matriks + Penguat</text>
  <text x="757" y="232" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Carbon Fiber (CFRP)</text>
  <text x="757" y="248" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="10">• Fiberglass (GFRP)</text>
</svg>