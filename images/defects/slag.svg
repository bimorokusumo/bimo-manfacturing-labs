<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weldBeadTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="weldBeadBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(249,115,22,0.3)" stroke-width="2" rx="12" />

  <!-- Header Banner -->
  <rect x="40" y="40" width="720" height="50" fill="#1e1e2e" rx="8" />
  <circle cx="65" cy="65" r="8" fill="#f97316" filter="url(#glow)" />
  <text x="85" y="72" fill="#f97316" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    CACAT LAS: SLAG INCLUSION (TERAK TERPERANGKAP)
  </text>

  <!-- Steel Base Plates -->
  <rect x="60" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />
  <rect x="420" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />

  <!-- Bottom Weld Pass Layer (Root/Fill Pass) -->
  <path d="M 370 280 Q 400 230 430 280 Q 400 310 370 280 Z" fill="url(#weldBeadBottom)" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Top Weld Pass Layer (Cap Pass) -->
  <path d="M 340 260 Q 400 180 460 260 Q 400 270 340 260 Z" fill="url(#weldBeadTop)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Trapped Slag Inclusions (Dark Non-Metallic Flux Islands) -->
  <path d="M 375 250 C 385 245, 395 255, 385 260 C 375 265, 365 255, 375 250 Z" fill="#451a03" stroke="#f97316" stroke-width="2" filter="url(#glow)" />
  <path d="M 415 248 C 425 242, 435 252, 425 258 C 415 262, 405 254, 415 248 Z" fill="#451a03" stroke="#f97316" stroke-width="2" filter="url(#glow)" />

  <!-- Callout 1: Left Slag Pocket -->
  <line x1="375" y1="255" x2="230" y2="150" stroke="#f97316" stroke-width="2" />
  <circle cx="230" cy="150" r="4" fill="#f97316" />
  <rect x="50" y="125" width="200" height="50" fill="#1e1e2e" stroke="#f97316" stroke-width="1.5" rx="6" />
  <text x="60" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Terak Flux Terperangkap</text>
  <text x="60" y="163" fill="#94a3b8" font-family="sans-serif" font-size="11">Tidak dibersihkan antar pass</text>

  <!-- Callout 2: Right Slag Pocket -->
  <line x1="425" y1="253" x2="570" y2="150" stroke="#f97316" stroke-width="2" />
  <circle cx="570" cy="150" r="4" fill="#f97316" />
  <rect x="570" y="125" width="180" height="50" fill="#1e1e2e" stroke="#f97316" stroke-width="1.5" rx="6" />
  <text x="580" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Inklusi Terak Non-Logam</text>
  <text x="580" y="163" fill="#94a3b8" font-family="sans-serif" font-size="11">Sudut elektroda salah</text>

  <!-- Footer Banner -->
  <rect x="40" y="390" width="720" height="30" fill="rgba(0,0,0,0.4)" rx="6" />
  <text x="400" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Penyebab: Pembersihan terak tak sempurna dengan chipping hammer / sikat baja pada multi-pass.
  </text>
</svg>
