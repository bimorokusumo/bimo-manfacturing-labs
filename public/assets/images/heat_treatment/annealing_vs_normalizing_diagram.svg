<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <radialGradient id="microscopeLens" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle">
    PERBANDINGAN MIKROSTRUKTUR: ANNEALING VS NORMALIZING
  </text>
  <text x="400" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Pengaruh Laju Pendinginan Lambat (Tungku) vs Pendinginan Udara Terhadap Ukuran Butir Kristal Baja
  </text>

  <!-- Left: Full Annealing (Coarse Pearlite + Ferrite) -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="310" height="275" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="38" rx="10" fill="#0369a1"/>
    <text x="155" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
      🧘 FULL ANNEALING (Pendinginan Tungku)
    </text>

    <!-- Circular Microscope View -->
    <g transform="translate(155, 115)">
      <circle cx="0" cy="0" r="62" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
      <!-- Coarse grains (Large polygonal grains with coarse lamellar stripes) -->
      <path d="M-55,-10 L-20,-45 L35,-40 L50,0 L15,45 L-40,40 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M-20,-45 L-10,-55 L25,-55 L35,-40 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M35,-40 L58,-20 L50,0 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M50,0 L55,30 L15,45 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M15,45 L-10,55 L-40,40 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M-40,40 L-58,15 L-55,-10 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Coarse lamellae inside central grain -->
      <line x1="-15" y1="-30" x2="25" y2="-25" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-20" y1="-15" x2="35" y2="-10" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-25" y1="0" x2="30" y2="5" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-20" y1="15" x2="20" y2="20" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="-10" y1="30" x2="10" y2="35" stroke="#cbd5e1" stroke-width="2.5"/>

      <circle cx="0" cy="0" r="62" fill="url(#microscopeLens)"/>
    </g>

    <!-- Details -->
    <g transform="translate(15, 195)">
      <text x="0" y="14" font-size="11" font-weight="800" fill="#38bdf8">Laju: Super Lambat (10–20°C/jam di oven)</text>
      <text x="0" y="30" font-size="10" fill="#e2e8f0">Struktur: Perlit Kasar + Ferit Lunak Bebas Tegangan</text>
      <text x="0" y="46" font-size="10" fill="#e2e8f0">Kekerasan: Sangat Rendah (~12 - 18 HRC / 140 HB)</text>
      <text x="0" y="62" font-size="11" font-weight="900" fill="#4ade80">🎯 Machinability: 100% (Paling Empuk Dibubut CNC)</text>
    </g>
  </g>

  <!-- Right: Normalizing (Fine Uniform Pearlite + Ferrite) -->
  <g transform="translate(430, 75)">
    <rect x="0" y="0" width="310" height="275" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="38" rx="10" fill="#059669"/>
    <text x="155" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">
      🌱 NORMALIZING (Pendinginan Udara Tenang)
    </text>

    <!-- Circular Microscope View -->
    <g transform="translate(155, 115)">
      <circle cx="0" cy="0" r="62" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
      
      <!-- Lots of small, uniform, fine grains -->
      <g stroke="#94a3b8" stroke-width="1" fill="#334155">
        <!-- Center cluster -->
        <polygon points="-15,-20 5,-25 15,-10 0,5 -15,0" />
        <polygon points="5,-25 25,-20 30,-5 15,-10" fill="#475569"/>
        <polygon points="15,-10 30,-5 25,15 5,10 0,5" fill="#64748b"/>
        <polygon points="0,5 5,10 -5,25 -20,20 -15,0" fill="#475569"/>
        <polygon points="-15,0 -20,20 -35,15 -35,-10" fill="#334155"/>
        <polygon points="-15,-20 -15,0 -35,-10 -25,-25" fill="#64748b"/>
        <polygon points="-25,-25 -15,-20 5,-25 0,-40 -20,-38" fill="#475569"/>
        <polygon points="5,-25 25,-20 20,-38 0,-40" fill="#334155"/>
        <!-- Surrounding fine grains -->
        <polygon points="25,-20 45,-15 42,-35 20,-38" fill="#64748b"/>
        <polygon points="25,-20 30,-5 50,5 45,-15" fill="#475569"/>
        <polygon points="30,-5 25,15 45,25 50,5" fill="#334155"/>
        <polygon points="25,15 5,10 10,35 35,40 45,25" fill="#64748b"/>
        <polygon points="5,10 -5,25 -10,45 10,35" fill="#475569"/>
        <polygon points="-5,25 -20,20 -30,40 -10,45" fill="#334155"/>
        <polygon points="-20,20 -35,15 -45,30 -30,40" fill="#64748b"/>
        <polygon points="-35,15 -35,-10 -52,0 -45,30" fill="#475569"/>
      </g>
      <!-- Tiny dense lamellae -->
      <line x1="-10" y1="-12" x2="5" y2="-15" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="-12" y1="-7" x2="3" y2="-9" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="12" y1="0" x2="22" y2="4" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="8" y1="5" x2="20" y2="9" stroke="#f1f5f9" stroke-width="1"/>

      <circle cx="0" cy="0" r="62" fill="url(#microscopeLens)"/>
    </g>

    <!-- Details -->
    <g transform="translate(15, 195)">
      <text x="0" y="14" font-size="11" font-weight="800" fill="#34d399">Laju: Sedang (Dikeluarkan di udara tenang)</text>
      <text x="0" y="30" font-size="10" fill="#e2e8f0">Struktur: Perlit Halus Seragam + Butir Kristal Padat</text>
      <text x="0" y="46" font-size="10" fill="#e2e8f0">Kekuatan: Tarik &amp; Ketangguhan (Impact) Lebih Tinggi</text>
      <text x="0" y="62" font-size="11" font-weight="900" fill="#facc15">🎯 Aplikasi: Poros Engkol, Rel Kereta Api, Gir Tempa</text>
    </g>
  </g>
</svg>
