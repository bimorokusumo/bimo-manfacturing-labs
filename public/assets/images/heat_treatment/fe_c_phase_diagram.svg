<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="100%" height="100%">
  <!-- Background -->
  <rect width="740" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect width="740" height="34" rx="8" fill="#0f172a"/>
  <rect y="26" width="740" height="8" fill="#0f172a"/>
  <text x="370" y="22" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">DIAGRAM FASA KESETIMBANGAN BESI-KARBON (Fe-C) &amp; ZONA HEAT TREATMENT</text>

  <!-- Plot Area -->
  <g transform="translate(65, 50)">
    <!-- Grid Box -->
    <rect width="460" height="230" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Y-axis Ticks & Labels (Temperature °C) -->
    <!-- 1000°C -->
    <line x1="-5" y1="30" x2="460" y2="30" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-12" y="34" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">1000°C</text>
    
    <!-- 912°C A3 start -->
    <line x1="-5" y1="65" x2="460" y2="65" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-12" y="69" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">912°C</text>

    <!-- 727°C A1 Line (Eutectoid Line) -->
    <line x1="-5" y1="135" x2="460" y2="135" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="-12" y="139" fill="#dc2626" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="end">727°C (A₁)</text>

    <!-- 500°C -->
    <line x1="-5" y1="185" x2="460" y2="185" stroke="#f1f5f9" stroke-width="1"/>
    <text x="-12" y="189" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">500°C</text>

    <!-- 20°C Room Temp -->
    <text x="-12" y="234" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">Room T</text>

    <!-- Y-axis Title -->
    <text x="-40" y="115" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" transform="rotate(-90 -40 115)">Temperatur (°C)</text>

    <!-- X-axis Labels (Carbon Content % C) -->
    <!-- 0.0% -->
    <text x="0" y="245" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">0.0%</text>
    <!-- 0.45% (S45C) -->
    <line x1="115" y1="0" x2="115" y2="235" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="115" y="245" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">0.45% (S45C)</text>
    <!-- 0.77% Eutectoid Point -->
    <line x1="200" y1="0" x2="200" y2="235" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="200" y="245" fill="#dc2626" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">0.77% (Eutectoid)</text>
    <!-- 1.2% Tool Steel -->
    <text x="310" y="245" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">1.2%</text>
    <!-- 2.14% Cast Iron boundary -->
    <line x1="420" y1="0" x2="420" y2="235" stroke="#475569" stroke-width="1"/>
    <text x="420" y="245" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">2.14% (Baja / Besi Cor)</text>

    <!-- X-axis Title -->
    <text x="230" y="260" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Kadar Karbon (% Carbon by weight)</text>

    <!-- Phase Curves -->
    <!-- A3 Line: from (0, 65) down to (200, 135) -->
    <path d="M 0 65 Q 100 115 200 135" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <!-- Acm Line: from (200, 135) up to (420, 20) -->
    <path d="M 200 135 Q 310 75 420 20" stroke="#7c3aed" stroke-width="2.5" fill="none"/>

    <!-- Austenit Region Gamma -->
    <rect x="15" y="10" width="180" height="45" rx="3" fill="#eff6ff" opacity="0.8"/>
    <text x="105" y="32" fill="#1d4ed8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">AUSTENIT (γ)</text>
    <text x="105" y="44" fill="#3b82f6" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Kisi FCC • Karbon larut penuh</text>

    <!-- Ferrite + Austenite -->
    <text x="75" y="110" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Ferit (α) + Austenit (γ)</text>

    <!-- Austenite + Cementite -->
    <text x="310" y="90" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Austenit (γ) + Sementit (Fe₃C)</text>

    <!-- Below 727°C (Room Temp Equilibrium) -->
    <!-- Hypoeutectoid: Ferrite + Pearlite -->
    <rect x="15" y="150" width="170" height="65" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="100" y="172" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Baja Hypo-Eutectoid</text>
    <text x="100" y="186" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Ferit (Lunak) + Perlit</text>
    <text x="100" y="200" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Kekerasan: 120 - 220 HB</text>

    <!-- Hypereutectoid: Pearlite + Cementite -->
    <rect x="215" y="150" width="195" height="65" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="312" y="172" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Baja Hyper-Eutectoid</text>
    <text x="312" y="186" fill="#7c3aed" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Perlit + Sementit Jaring (Fe₃C)</text>
    <text x="312" y="200" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Kekerasan: 250 - 350 HB (Getas)</text>
  </g>

  <!-- Quenching to Martensite Callout Box (Right Side) -->
  <g transform="translate(545, 50)">
    <rect width="180" height="230" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="180" height="26" rx="6" fill="#ef4444"/>
    <rect y="20" width="180" height="6" fill="#ef4444"/>
    <text x="90" y="17" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">JALUR CEPAT: QUENCHING</text>

    <text x="90" y="44" fill="#b91c1c" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Transformasi Non-Equilibrium</text>
    
    <g transform="translate(10, 52)">
      <rect width="160" height="42" rx="4" fill="#ffffff" stroke="#fca5a5"/>
      <text x="80" y="16" fill="#991b1b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">MARTENSIT (BCT)</text>
      <text x="80" y="28" fill="#dc2626" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Kekerasan: 60 – 66 HRC!</text>
      <text x="80" y="37" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">Kisi terdistorsi &amp; sangat getas</text>
    </g>

    <!-- Arrow down -->
    <line x1="90" y1="100" x2="90" y2="114" stroke="#dc2626" stroke-width="2"/>
    <polygon points="86,114 94,114 90,120" fill="#dc2626"/>

    <g transform="translate(10, 122)">
      <rect width="160" height="48" rx="4" fill="#ffffff" stroke="#f59e0b"/>
      <text x="80" y="16" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">+ PROSES TEMPERING</text>
      <text x="80" y="28" fill="#d97706" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Martensit Temper (Liat)</text>
      <text x="80" y="40" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Kekerasan: 48 – 58 HRC ulet</text>
    </g>

    <!-- Takeaway badge -->
    <rect x="10" y="178" width="160" height="42" rx="4" fill="#fee2e2"/>
    <text x="80" y="193" fill="#991b1b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">HUKUM EMAS HEAT TREAT:</text>
    <text x="80" y="205" fill="#7f1d1d" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">"Hardening tanpa Tempering</text>
    <text x="80" y="215" fill="#7f1d1d" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" text-anchor="middle">adalah bencana patah fatal!"</text>
  </g>
</svg>
