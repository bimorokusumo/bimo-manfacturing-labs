<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="furnaceGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="oilQuenchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <radialGradient id="fireBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" fill="#f8fafc" text-anchor="middle">
    ALUR VISUAL PROSES HARDENING (PENGURUSAN CEPAT &amp; QUENCHING)
  </text>
  <text x="400" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Mengapa Baja Menjadi Keras Seperti Intan? Dari Kisi Lunak BCC Menjadi Kisi Martensit Jarum Terdistorsi (BCT)
  </text>

  <!-- STEP 1: Pemanasan Tungku 850°C (Austenitisasi) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#111827" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="32" rx="10" fill="#7f1d1d"/>
    <text x="110" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle">
      1. TUNGKU MEMBARA (850°C)
    </text>

    <!-- Furnace Interior Box -->
    <rect x="30" y="45" width="160" height="100" rx="6" fill="#450a0a" stroke="#ea580c" stroke-width="2"/>
    <!-- Glowing Coils -->
    <path d="M 35,60 Q 45,52 55,60 T 75,60 T 95,60 T 115,60 T 135,60 T 155,60 T 175,60 T 185,60" fill="none" stroke="#f97316" stroke-width="3"/>
    <path d="M 35,130 Q 45,122 55,130 T 75,130 T 95,130 T 115,130 T 135,130 T 155,130 T 175,130 T 185,130" fill="none" stroke="#f97316" stroke-width="3"/>

    <!-- Red-Hot Glowing Steel Bar -->
    <rect x="65" y="80" width="90" height="25" rx="3" fill="url(#furnaceGlow)" stroke="#fef08a" stroke-width="2" filter="drop-shadow(0 0 8px #ea580c)"/>
    <text x="110" y="97" font-size="9" font-weight="900" fill="#7f1d1d" text-anchor="middle">AUSTENIT (FCC)</text>

    <!-- Step 1 Details -->
    <g transform="translate(15, 160)">
      <text x="0" y="12" font-size="11" font-weight="800" fill="#f87171">🌡️ Suhu: 820°C - 920°C</text>
      <text x="0" y="28" font-size="10" fill="#e2e8f0">Kisi besi berubah jadi FCC</text>
      <text x="0" y="44" font-size="10" fill="#e2e8f0">Atom karbon larut homogen</text>
      <text x="0" y="60" font-size="10" fill="#94a3b8">⏱️ Tahan 1 jam / 25 mm tebal</text>
      <text x="0" y="78" font-size="10" font-weight="800" fill="#facc15">⚠️ Siap celup kilat &lt; 5 detik!</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(265, 180)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#f97316" stroke-width="3"/>
    <polygon points="20,-5 28,0 20,5" fill="#f97316"/>
  </g>

  <!-- STEP 2: Celup Kilat (Rapid Quench di Tangki Oli) -->
  <g transform="translate(295, 75)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="32" rx="10" fill="#9a3412"/>
    <text x="110" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. CELUP KILAT / QUENCH (OLI)
    </text>

    <!-- Quench Tank Vat -->
    <rect x="30" y="55" width="160" height="90" rx="6" fill="url(#oilQuenchGrad)" stroke="#64748b" stroke-width="2"/>
    <!-- Oil liquid surface -->
    <path d="M 30,75 Q 70,68 110,75 T 190,75 L 190,145 L 30,145 Z" fill="#3b2d18" opacity="0.8"/>
    <!-- Dipping Tongs & Hot Steel Bar Plunging Vertically -->
    <line x1="110" y1="40" x2="110" y2="80" stroke="#94a3b8" stroke-width="3"/>
    <rect x="104" y="80" width="12" height="45" rx="2" fill="#ea580c" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Steam and Smoke Puffs -->
    <circle cx="85" cy="65" r="10" fill="#94a3b8" opacity="0.5"/>
    <circle cx="95" cy="55" r="8" fill="#cbd5e1" opacity="0.6"/>
    <circle cx="125" cy="60" r="9" fill="#94a3b8" opacity="0.5"/>
    <circle cx="110" cy="72" r="12" fill="url(#fireBurst)" opacity="0.7"/>

    <!-- Step 2 Details -->
    <g transform="translate(15, 160)">
      <text x="0" y="12" font-size="11" font-weight="800" fill="#fb923c">⚡ Laju: &gt; 80°C / detik!</text>
      <text x="0" y="28" font-size="10" fill="#e2e8f0">Celup vertikal (anti-bengkok)</text>
      <text x="0" y="44" font-size="10" fill="#e2e8f0">Agitasi goyang pecah uap</text>
      <text x="0" y="60" font-size="10" fill="#94a3b8">Atom karbon tak sempat kabur!</text>
      <text x="0" y="78" font-size="10" font-weight="800" fill="#38bdf8">🧊 Media: Oli hangat 50°C</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(520, 180)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#f97316" stroke-width="3"/>
    <polygon points="20,-5 28,0 20,5" fill="#f97316"/>
  </g>

  <!-- STEP 3: Terjebak Jadi Martensit 65 HRC -->
  <g transform="translate(545, 75)">
    <rect x="0" y="0" width="215" height="260" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="32" rx="10" fill="#065f46"/>
    <text x="107" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#a7f3d0" text-anchor="middle">
      3. MARTENSIT SUPER KERAS
    </text>

    <!-- Microscope Needles Graphic (BCT Martensite) -->
    <g transform="translate(107, 100)">
      <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <!-- Acicular Martensite Needles (Intersecting blades) -->
      <line x1="-30" y1="-25" x2="35" y2="20" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
      <line x1="-25" y1="20" x2="30" y2="-20" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-35" y1="5" x2="20" y2="35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-35" x2="25" y2="10" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-15" y1="-10" x2="-5" y2="30" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- Step 3 Details -->
    <g transform="translate(15, 160)">
      <text x="0" y="12" font-size="12" font-weight="900" fill="#4ade80">💎 Kekerasan: 60 - 66 HRC</text>
      <text x="0" y="28" font-size="10" fill="#e2e8f0">Struktur: Martensit Jarum (BCT)</text>
      <text x="0" y="44" font-size="10" fill="#e2e8f0">Tahan aus &amp; mata pisau tajam</text>
      <text x="0" y="60" font-size="10" font-weight="800" fill="#f87171">⚠️ Getas seperti kaca!</text>
      <text x="0" y="78" font-size="10" font-weight="900" fill="#facc15">➔ Wajib Tempering Segera!</text>
    </g>
  </g>
</svg>
