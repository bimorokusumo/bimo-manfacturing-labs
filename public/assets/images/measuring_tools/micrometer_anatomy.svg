<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradMicro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071524" />
      <stop offset="50%" stop-color="#0c2135" />
      <stop offset="100%" stop-color="#030c14" />
    </linearGradient>

    <!-- Chrome & Steel -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cast Iron Blue/Green Hammered Frame -->
    <linearGradient id="frameCast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="50%" stop-color="#0f2642" />
      <stop offset="100%" stop-color="#0a192c" />
    </linearGradient>

    <!-- Plastic Thermal Insulator -->
    <linearGradient id="insulatorPlastic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadowMicro" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGradMicro)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Blueprint Subtle Grid -->
  <pattern id="gridMicro" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.7" stroke-opacity="0.5" />
  </pattern>
  <rect width="960" height="540" rx="16" fill="url(#gridMicro)"/>

  <!-- Header Banner -->
  <g transform="translate(40, 28)">
    <rect width="880" height="48" rx="8" fill="#0f2642" stroke="#1e4976" stroke-width="1.2"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#0284c7"/>
    <text x="24" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      ANATOMI &amp; KOMPONEN MIKROMETER SEKRUP (OUTSIDE MICROMETER)
    </text>
    <text x="24" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">
      Standar Metrologi Industri DIN 863 / ISO 3611 • Rentang Ukur 0 - 25 mm • Resolusi Ketelitian 0,01 mm
    </text>
    <rect x="730" y="10" width="135" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="797" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">
      PRINSIP ULIR 0,5 mm
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- MICROMETER VECTOR ARTWORK -->
  <!-- ============================================================== -->
  <g id="micrometerVector" transform="translate(90, 160)" filter="url(#shadowMicro)">
    
    <!-- Cast Bow Frame (Bingkai Busur U) -->
    <path d="M 90,80 
             C 40,80 0,130 0,200 
             C 0,290 80,330 200,330 
             C 310,330 380,270 380,180 
             L 380,80 
             L 330,80 
             L 330,170 
             C 330,230 280,280 190,280 
             C 100,280 50,240 50,190 
             C 50,140 70,105 100,105 
             L 100,80 Z" 
          fill="url(#frameCast)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Thermal Insulator Pad on Frame (Plat Pelindung Panas) -->
    <path d="M 120,290 C 150,305 210,305 240,290 L 250,320 C 220,335 140,335 110,320 Z" 
          fill="url(#insulatorPlastic)" stroke="#475569" stroke-width="1.2"/>
    <text x="180" y="315" font-size="9" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="1">0 - 25 mm  0.01 mm</text>

    <!-- Fixed Anvil (Landasan Tetap di kiri) -->
    <rect x="75" y="65" width="25" height="18" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.2"/>
    <!-- Carbide Contact Tip on Anvil -->
    <rect x="94" y="66" width="6" height="16" fill="#cbd5e1" stroke="#475569"/>

    <!-- Spindle (Poros Geser) -->
    <!-- Terbuka memberi celah 12 mm terhadap anvil -->
    <rect x="155" y="66" width="180" height="16" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.2"/>
    <!-- Carbide Contact Tip on Spindle -->
    <rect x="155" y="66" width="6" height="16" fill="#cbd5e1" stroke="#475569"/>

    <!-- Lock Nut / Lever (Tuas Pengunci Spindel) -->
    <g transform="translate(345, 45)">
      <path d="M 0,25 Q -10,10 -5,0 Q 5,0 10,25 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
      <circle cx="2" cy="22" r="5" fill="#475569"/>
    </g>

    <!-- Sleeve / Barrel (Silinder Tetap berskala utama) -->
    <rect x="375" y="55" width="140" height="38" rx="2" fill="url(#chromeMetal)" stroke="#475569" stroke-width="1.5"/>
    <!-- Sleeve Baseline (Garis Datum Nol Horizontal) -->
    <line x1="385" y1="74" x2="485" y2="74" stroke="#0f172a" stroke-width="1.6"/>
    <!-- Upper Graduations (mm bulat 0, 1, 2, ... 10) -->
    <line x1="395" y1="62" x2="395" y2="74" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="410" y1="66" x2="410" y2="74" stroke="#0f172a"/>
    <line x1="425" y1="66" x2="425" y2="74" stroke="#0f172a"/>
    <line x1="440" y1="66" x2="440" y2="74" stroke="#0f172a"/>
    <line x1="455" y1="66" x2="455" y2="74" stroke="#0f172a"/>
    <line x1="470" y1="62" x2="470" y2="74" stroke="#0f172a" stroke-width="1.4"/>
    <text x="395" y="60" font-size="7.5" font-weight="800" fill="#0f172a" text-anchor="middle">0</text>
    <text x="470" y="60" font-size="7.5" font-weight="800" fill="#0f172a" text-anchor="middle">5</text>
    <!-- Lower Graduations (Setengah mm 0.5, 1.5, 2.5 ...) -->
    <line x1="402" y1="74" x2="402" y2="82" stroke="#0f172a"/>
    <line x1="417" y1="74" x2="417" y2="82" stroke="#0f172a"/>
    <line x1="432" y1="74" x2="432" y2="82" stroke="#0f172a"/>
    <line x1="447" y1="74" x2="447" y2="82" stroke="#0f172a"/>
    <line x1="462" y1="74" x2="462" y2="82" stroke="#0f172a"/>

    <!-- Thimble (Bidal Putar berskala keliling 50 bagian) -->
    <!-- Beveled Edge (Tirus Skala) -->
    <path d="M 480,51 L 505,55 L 505,93 L 480,97 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
    <!-- Thimble Main Knurled Body -->
    <rect x="505" y="53" width="130" height="42" fill="url(#chromeMetal)" stroke="#475569" stroke-width="1.5"/>
    <!-- Knurling texture pattern on Thimble -->
    <g stroke="#64748b" stroke-width="0.8">
      <line x1="535" y1="54" x2="535" y2="94"/>
      <line x1="545" y1="54" x2="545" y2="94"/>
      <line x1="555" y1="54" x2="555" y2="94"/>
      <line x1="565" y1="54" x2="565" y2="94"/>
      <line x1="575" y1="54" x2="575" y2="94"/>
      <line x1="585" y1="54" x2="585" y2="94"/>
      <line x1="595" y1="54" x2="595" y2="94"/>
      <line x1="605" y1="54" x2="605" y2="94"/>
      <line x1="615" y1="54" x2="615" y2="94"/>
      <line x1="625" y1="54" x2="625" y2="94"/>
    </g>
    <!-- Graduations on Thimble Bevel (0, 5, 10, 15, 20...) -->
    <line x1="480" y1="74" x2="496" y2="74" stroke="#0284c7" stroke-width="1.8"/>
    <text x="498" y="77" font-size="7.5" font-weight="900" fill="#0284c7">20</text>
    <line x1="481" y1="67" x2="492" y2="67" stroke="#0f172a"/>
    <line x1="482" y1="61" x2="495" y2="61" stroke="#0f172a"/>
    <text x="498" y="64" font-size="7" font-weight="800" fill="#0f172a">25</text>
    <line x1="481" y1="81" x2="492" y2="81" stroke="#0f172a"/>
    <line x1="482" y1="87" x2="495" y2="87" stroke="#0f172a"/>
    <text x="498" y="90" font-size="7" font-weight="800" fill="#0f172a">15</text>

    <!-- Ratchet Stop (Gigi Gelincir Raset) -->
    <rect x="635" y="61" width="55" height="26" rx="3" fill="#475569" stroke="#334155" stroke-width="1.2"/>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="643" y1="62" x2="643" y2="86"/>
      <line x1="650" y1="62" x2="650" y2="86"/>
      <line x1="657" y1="62" x2="657" y2="86"/>
      <line x1="664" y1="62" x2="664" y2="86"/>
      <line x1="671" y1="62" x2="671" y2="86"/>
      <line x1="678" y1="62" x2="678" y2="86"/>
    </g>
    <!-- Ratchet cap button -->
    <rect x="690" y="67" width="10" height="14" rx="2" fill="#334155"/>
  </g>

  <!-- ============================================================== -->
  <!-- CALLOUT LABELS & LEADER LINES -->
  <!-- ============================================================== -->
  
  <!-- 1. Landasan Tetap (Anvil) -->
  <g transform="translate(40, 95)">
    <line x1="130" y1="40" x2="140" y2="135" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="140" cy="135" r="4" fill="#38bdf8"/>
    <rect width="190" height="52" rx="8" fill="#0f2642" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#38bdf8"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#000" text-anchor="middle">1</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Landasan Tetap (Anvil)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Datum kontak ujung karbida</text>
  </g>

  <!-- 2. Poros Geser (Spindle) -->
  <g transform="translate(250, 95)">
    <line x1="40" y1="40" x2="20" y2="135" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="20" cy="135" r="4" fill="#10b981"/>
    <rect width="190" height="52" rx="8" fill="#0f2642" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#10b981"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#000" text-anchor="middle">2</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Poros Ukur (Spindle)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Maju-mundur via ulir mikron</text>
  </g>

  <!-- 3. Tuas Pengunci (Lock Nut / Lever) -->
  <g transform="translate(460, 95)">
    <line x1="-10" y1="30" x2="-20" y2="110" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="-20" cy="110" r="4" fill="#f59e0b"/>
    <rect width="190" height="52" rx="8" fill="#0f2642" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#f59e0b"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#000" text-anchor="middle">3</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Tuas Pengunci (Lock Lever)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Kunci spindel saat membaca</text>
  </g>

  <!-- 4. Laras / Silinder Tetap (Sleeve / Barrel) -->
  <g transform="translate(670, 95)">
    <line x1="-120" y1="40" x2="-140" y2="120" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="-140" cy="120" r="4" fill="#a855f7"/>
    <rect width="200" height="52" rx="8" fill="#0f2642" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#a855f7"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Silinder Tetap (Sleeve)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Skala utama (mm &amp; 0.5 mm)</text>
  </g>

  <!-- 5. Bidal / Tabung Putar (Thimble) -->
  <g transform="translate(670, 240)">
    <line x1="-50" y1="10" x2="-80" y2="-10" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="-80" cy="-10" r="4" fill="#ec4899"/>
    <rect width="200" height="52" rx="8" fill="#0f2642" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#ec4899"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">5</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Bidal Putar (Thimble)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Skala nonius 50 strip (0.01 mm)</text>
  </g>

  <!-- 6. Gigi Gelincir / Raset (Ratchet Stop) -->
  <g transform="translate(670, 360)">
    <line x1="20" y1="-20" x2="80" y2="-130" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="80" cy="-130" r="4" fill="#06b6d4"/>
    <rect width="200" height="52" rx="8" fill="#0f2642" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#06b6d4"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#000" text-anchor="middle">6</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Raset (Ratchet Stop)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Standarisasi tekanan 5-10 N</text>
  </g>

  <!-- 7. Bingkai Busur U (Frame) -->
  <g transform="translate(40, 420)">
    <line x1="80" y1="-10" x2="90" y2="-150" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="90" cy="-150" r="4" fill="#3b82f6"/>
    <rect width="200" height="52" rx="8" fill="#0f2642" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#3b82f6"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">7</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Bingkai Busur (U-Frame)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Struktur baja kaku anti-lentur</text>
  </g>

  <!-- 8. Pelindung Panas (Thermal Insulator) -->
  <g transform="translate(260, 420)">
    <line x1="80" y1="-10" x2="20" y2="-60" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="20" cy="-60" r="4" fill="#f97316"/>
    <rect width="220" height="52" rx="8" fill="#0f2642" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="12" fill="#f97316"/>
    <text x="20" y="31" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">8</text>
    <text x="40" y="21" font-size="11" font-weight="800" fill="#f8fafc">Pelindung Panas (Insulator)</text>
    <text x="40" y="38" font-size="9.5" fill="#94a3b8">Cegah muai panas dari telapak tangan</text>
  </g>

  <!-- Footer Info Bar -->
  <rect x="40" y="492" width="880" height="30" rx="6" fill="#030c14" stroke="#1e3a5f"/>
  <text x="55" y="512" font-size="10" font-weight="700" fill="#38bdf8">ATURAN EMAS:</text>
  <text x="160" y="512" font-size="9.5" fill="#94a3b8">
    Saat mengunci benda kerja, hentikan memutar thimble. Putar ratchet stop hingga terdengar bunyi "klik" 2-3 kali!
  </text>
</svg>
