<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="wrenchChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="pipeExt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="boltCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="380" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle">
    HUKUM MOMEN GAYA (TORSI): MENGAPA MEMEGANG KUNCI JAUH TERASA LEBIH ENTENG?
  </text>
  <text x="400" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Rumus Emas: Torsi (τ) = Gaya Otot (F) × Lengan Momen (d) ➔ Semakin Jauh Pegangan Tangan, Semakin Ringan Gaya Yang Dibutuhkan!
  </text>

  <!-- Central Graphic: Wrench on Hex Bolt -->
  <g transform="translate(60, 90)">
    <!-- Arc of Rotation & Direction -->
    <path d="M 60,60 A 70 70 0 0 1 120,10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="120,5 128,12 118,17" fill="#38bdf8"/>
    <text x="95" y="30" font-size="10" font-weight="800" fill="#38bdf8">Arah Putar (Torsi = 60 Nm)</text>

    <!-- Stuck Hex Bolt (Pivot Point / Titik Tumpu O) -->
    <g transform="translate(60, 80)">
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#boltCenter)" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#64748b"/>
      <text x="0" y="3" font-size="8" font-weight="900" fill="#f87171" text-anchor="middle">BAUT</text>
      <!-- Pivot Mark -->
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      <text x="-4" y="44" font-size="11" font-weight="900" fill="#f87171" text-anchor="middle">Titik Putar (d = 0)</text>
    </g>

    <!-- Wrench Head Open End gripping bolt -->
    <path d="M 60,80 L 100,68 L 380,68 L 380,92 L 100,92 Z" fill="url(#wrenchChrome)" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="78" cy="80" r="22" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- Wrench Ring End at 380 -->
    <circle cx="380" cy="80" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>

    <!-- Extension Cheater Pipe (Optional Pipa Sambung from 360 to 620) -->
    <rect x="360" y="62" width="280" height="36" rx="6" fill="url(#pipeExt)" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="500" y="84" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">Pipa Sambungan Tambahan (Cheater Pipe)</text>

    <!-- Dimension Lines for Distance (d) -->
    <!-- Position 1: d = 10 cm (DEKAT - MERAH) -->
    <line x1="60" y1="130" x2="160" y2="130" stroke="#ef4444" stroke-width="2"/>
    <line x1="60" y1="120" x2="60" y2="140" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="160" y1="100" x2="160" y2="140" stroke="#ef4444" stroke-width="1.5"/>
    <text x="110" y="145" font-size="10" font-weight="900" fill="#f87171" text-anchor="middle">d = 10 cm</text>

    <!-- Position 2: d = 30 cm (UJUNG KUNCI - KUNING) -->
    <line x1="60" y1="160" x2="360" y2="160" stroke="#f59e0b" stroke-width="2"/>
    <line x1="360" y1="100" x2="360" y2="170" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="210" y="175" font-size="10" font-weight="900" fill="#fbbf24" text-anchor="middle">d = 30 cm (Ujung Kunci Standar)</text>

    <!-- Position 3: d = 60 cm (UJUNG PIPA - HIJAU) -->
    <line x1="60" y1="190" x2="630" y2="190" stroke="#10b981" stroke-width="2"/>
    <line x1="630" y1="100" x2="630" y2="200" stroke="#10b981" stroke-width="1.5"/>
    <text x="345" y="205" font-size="10" font-weight="900" fill="#34d399" text-anchor="middle">d = 60 cm (Dengan Pipa Panjang)</text>

    <!-- Hand Forces / Vectors (F) pushing down -->
    <!-- Force 1 at 160: HUGE FORCE (600 N) -->
    <g transform="translate(160, 10)">
      <line x1="0" y1="0" x2="0" y2="55" stroke="#ef4444" stroke-width="5"/>
      <polygon points="-8,45 0,58 8,45" fill="#ef4444"/>
      <text x="0" y="-8" font-size="13" font-weight="900" fill="#ef4444" text-anchor="middle">F = 600 N</text>
      <text x="0" y="8" font-size="9" fill="#fca5a5" text-anchor="middle">≈ 61 kg (BERAT SEKALI!)</text>
      <!-- Hand Icon -->
      <circle cx="0" cy="25" r="14" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="0" y="29" font-size="10" fill="#ffffff" text-anchor="middle">✋</text>
    </g>

    <!-- Force 2 at 360: MEDIUM FORCE (200 N) -->
    <g transform="translate(360, 20)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#f59e0b" stroke-width="3.5"/>
      <polygon points="-6,36 0,48 6,36" fill="#f59e0b"/>
      <text x="0" y="-8" font-size="12" font-weight="900" fill="#f59e0b" text-anchor="middle">F = 200 N</text>
      <text x="0" y="6" font-size="9" fill="#fde68a" text-anchor="middle">≈ 20 kg (SEDANG)</text>
      <circle cx="0" cy="22" r="12" fill="#78350f" stroke="#f59e0b"/>
      <text x="0" y="26" font-size="9" fill="#ffffff" text-anchor="middle">✋</text>
    </g>

    <!-- Force 3 at 630: LIGHT FORCE (100 N) -->
    <g transform="translate(630, 28)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#10b981" stroke-width="2.5"/>
      <polygon points="-5,28 0,38 5,28" fill="#10b981"/>
      <text x="0" y="-8" font-size="12" font-weight="900" fill="#10b981" text-anchor="middle">F = 100 N</text>
      <text x="0" y="6" font-size="9" fill="#a7f3d0" text-anchor="middle">≈ 10 kg (SUPER RINGAN!)</text>
      <circle cx="0" cy="18" r="11" fill="#064e3b" stroke="#10b981"/>
      <text x="0" y="22" font-size="8" fill="#ffffff" text-anchor="middle">👌</text>
    </g>
  </g>

  <!-- Bottom Comparison Cards -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="15" y="20" font-size="11" font-weight="900" fill="#f87171">❌ Pegangan Dekat (10 cm):</text>
    <text x="15" y="35" font-size="9" fill="#cbd5e1">Lengan momen pendek ➔ Butuh gaya</text>
    <text x="15" y="47" font-size="9" font-weight="800" fill="#fca5a5">600 N! Baut macet &amp; tangan gemetar.</text>
  </g>

  <g transform="translate(290, 310)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="20" font-size="11" font-weight="900" fill="#fbbf24">🟡 Pegangan Ujung Kunci (30 cm):</text>
    <text x="15" y="35" font-size="9" fill="#cbd5e1">Lengan 3x lebih panjang ➔ Gaya turun</text>
    <text x="15" y="47" font-size="9" font-weight="800" fill="#fde68a">menjadi 200 N (3x lebih ringan!).</text>
  </g>

  <g transform="translate(530, 310)">
    <rect x="0" y="0" width="220" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="20" font-size="11" font-weight="900" fill="#34d399">✅ Pakai Pipa Sambung (60 cm):</text>
    <text x="15" y="35" font-size="9" fill="#cbd5e1">Lengan 6x lipat ➔ Hanya butuh</text>
    <text x="15" y="47" font-size="9" font-weight="800" fill="#a7f3d0">100 N (6x lebih enteng, baut lepas!).</text>
  </g>
</svg>
