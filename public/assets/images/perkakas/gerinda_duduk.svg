<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="grinderMotor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="roughWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fineWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(450, 36)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
      MESIN GERINDA DUDUK BANGKU (BENCH GRINDER) &amp; CELAH KERJA AMAN
    </text>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
      Perkakas Bertenaga Pengasah Pahat Bubut &amp; Mata Bor: Standar Celah Landasan (Tool Rest) Maksimal 2-3 mm
    </text>
  </g>

  <!-- BENCH GRINDER MACHINE DRAWING (Center Top) -->
  <g transform="translate(250, 75)">
    <!-- Base Mounting Tapak -->
    <rect x="70" y="170" width="260" height="35" rx="5" fill="#334155" stroke="#475569" stroke-width="2"/>
    <!-- Switch Box -->
    <rect x="175" y="150" width="50" height="25" rx="4" fill="#0f172a" stroke="#cbd5e1"/>
    <circle cx="200" cy="162" r="6" fill="#22c55e"/>

    <!-- Central Electric Motor Housing (Bodi Motor Listrik) -->
    <ellipse cx="200" cy="100" rx="85" ry="60" fill="url(#grinderMotor)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Motor Cooling Fins -->
    <line x1="150" y1="65" x2="150" y2="135" stroke="#0284c7" stroke-width="3"/>
    <line x1="175" y1="50" x2="175" y2="150" stroke="#0284c7" stroke-width="3"/>
    <line x1="200" y1="42" x2="200" y2="158" stroke="#0284c7" stroke-width="3"/>
    <line x1="225" y1="50" x2="225" y2="150" stroke="#0284c7" stroke-width="3"/>
    <line x1="250" y1="65" x2="250" y2="135" stroke="#0284c7" stroke-width="3"/>

    <!-- LEFT WHEEL ASSEMBLY (Batu Kasar Grit 36 - Warna Gelap) -->
    <!-- Steel Guard -->
    <path d="M 90,30 C 20,30 20,170 90,170 L 90,140 C 45,140 45,60 90,60 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Wheel Disc -->
    <rect x="50" y="45" width="35" height="110" rx="4" fill="url(#roughWheel)" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="67" cy="100" rx="10" ry="15" fill="#cbd5e1" stroke="#334155"/>
    <!-- Left Eye Shield (Kaca Pengaman Mata Bening) -->
    <rect x="35" y="10" width="55" height="30" rx="3" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="62" y1="10" x2="90" y2="35" stroke="#94a3b8" stroke-width="2"/>
    <!-- Left Tool Rest (Landasan Benda Kerja) -->
    <path d="M 20,115 L 47,115 L 47,125 L 30,140 L 20,140 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

    <!-- RIGHT WHEEL ASSEMBLY (Batu Halus Grit 60/80 - Warna Terang) -->
    <!-- Steel Guard -->
    <path d="M 310,30 C 380,30 380,170 310,170 L 310,140 C 355,140 355,60 310,60 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Wheel Disc -->
    <rect x="315" y="45" width="35" height="110" rx="4" fill="url(#fineWheel)" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="332" cy="100" rx="10" ry="15" fill="#cbd5e1" stroke="#334155"/>
    <!-- Right Eye Shield -->
    <rect x="310" y="10" width="55" height="30" rx="3" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="337" y1="10" x2="310" y2="35" stroke="#94a3b8" stroke-width="2"/>
    <!-- Right Tool Rest -->
    <path d="M 380,115 L 353,115 L 353,125 L 370,140 L 380,140 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

    <!-- CALLOUTS & MEASUREMENT HIGHLIGHTS -->
    <!-- Tool Rest Dimension Pointer -->
    <line x1="47" y1="120" x2="7" y2="120" stroke="#ef4444" stroke-width="1.5"/>
    <text x="2" y="112" fill="#ef4444" font-size="9" font-weight="900" text-anchor="end">CELAH MAKS 2 - 3 mm!</text>
    <text x="2" y="124" fill="#fca5a5" font-size="7.5" text-anchor="end">(OSHA 1910.215)</text>

    <!-- Spark Deflector Callout Top -->
    <line x1="320" y1="35" x2="390" y2="15" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="320" cy="35" r="3" fill="#38bdf8"/>
    <text x="395" y="12" fill="#38bdf8" font-size="9" font-weight="800">Spark Deflector (Celah &le; 1.6 mm)</text>
    <text x="395" y="22" fill="#94a3b8" font-size="7.5">Penahan percikan api atas</text>

    <!-- Label Batu Kasar -->
    <text x="67" y="185" fill="#94a3b8" font-size="8.5" font-weight="800" text-anchor="middle">Batu Kasar (Grit 36)</text>
    <text x="67" y="196" fill="#64748b" font-size="7.5" text-anchor="middle">Pengasahan awal/buang tatal</text>

    <!-- Label Batu Halus -->
    <text x="332" y="185" fill="#f8fafc" font-size="8.5" font-weight="800" text-anchor="middle">Batu Halus (Grit 60-80)</text>
    <text x="332" y="196" fill="#94a3b8" font-size="7.5" text-anchor="middle">Finishing pahat &amp; twist drill</text>
  </g>

  <!-- BOTTOM HALF: ATURAN MUTLAK K3 & JARAK AMAN TOOL REST -->
  <g transform="translate(50, 305)">
    <!-- Box 1: Mengapa Harus 2-3 mm? -->
    <rect x="0" y="0" width="385" height="185" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M 0,0 L 385,0 L 385,32 L 0,32 Z" fill="#ea580c" rx="10"/>
    <text x="16" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff">
      📏 ATURAN JARAK LANDASAN (TOOL REST): 2 s.d. 3 mm
    </text>

    <g transform="translate(16, 45)">
      <!-- Visual Bahaya Celah Lebar -->
      <text x="0" y="14" fill="#fca5a5" font-size="10" font-weight="900">❌ BAHAYA FATAL JIKA CELAH &gt; 3 mm:</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="8.5">
        Jika jarak landasan ke batu gerinda lebih dari 3 mm:
      </text>
      <text x="0" y="48" fill="#f87171" font-size="8.5" font-weight="700">
        1. Benda kerja kecil/tipis akan terselot dan terseret ke bawah!
      </text>
      <text x="0" y="64" fill="#f87171" font-size="8.5" font-weight="700">
        2. Mengakibatkan batu gerinda pecah berkeping-keping (wheel explosion).
      </text>
      <text x="0" y="80" fill="#f87171" font-size="8.5" font-weight="700">
        3. Jari operator ikut terjepit ke batu yang berputar 3000 RPM.
      </text>

      <line x1="0" y1="92" x2="350" y2="92" stroke="#334155" stroke-width="1"/>
      <text x="0" y="108" fill="#4ade80" font-size="9" font-weight="800">
        ✓ SOP PENYETELAN HARIAN:
      </text>
      <text x="0" y="122" fill="#94a3b8" font-size="8">
        Kendorkan baut landasan, gunakan pengukur celah (drill bit shank 3mm), setel rapat 2-3 mm, kencangkan kembali baut saat mesin mati.
      </text>
    </g>

    <!-- Box 2: 5 Larangan Mutlak Bench Grinder -->
    <rect x="415" y="0" width="385" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 415,0 L 800,0 L 800,32 L 415,32 Z" fill="#334155" rx="10"/>
    <text x="431" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#f8fafc">
      🚫 5 LARANGAN MUTLAK GERINDA DUDUK
    </text>

    <g transform="translate(431, 45)">
      <text x="0" y="14" fill="#ef4444" font-size="9" font-weight="800">1. DILARANG MENGASAH DI SISI SAMPING BATU GERINDA!</text>
      <text x="0" y="26" fill="#94a3b8" font-size="8">Sisi samping sangat tipis; tekanan samping menyebabkan batu pecah membahayakan.</text>

      <text x="0" y="44" fill="#ef4444" font-size="9" font-weight="800">2. DILARANG MENGASAH ALUMINIUM, KUNINGAN, ATAU KAYU!</text>
      <text x="0" y="56" fill="#94a3b8" font-size="8">Logam lunak meleleh menyumbat pori batu (loading), memicu overheat dan letupan.</text>

      <text x="0" y="74" fill="#ef4444" font-size="9" font-weight="800">3. DILARANG MENGGUNAKAN SARUNG TANGAN KAIN!</text>
      <text x="0" y="86" fill="#94a3b8" font-size="8">Benang kain mudah terseret putaran batu; gunakan tang pemegang jika benda panas.</text>

      <text x="0" y="104" fill="#ef4444" font-size="9" font-weight="800">4. DILARANG MENYALAKAN TANPA EYE SHIELD &amp; GOGGLES!</text>
      <text x="0" y="116" fill="#94a3b8" font-size="8">Kaca transparan pada mesin + kacamata safety ANSI Z87.1 adalah perlindungan ganda.</text>
    </g>
  </g>
</svg>
