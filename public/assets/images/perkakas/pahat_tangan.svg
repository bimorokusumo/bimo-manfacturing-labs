<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="chiselSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="chiselEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="dangerMushroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(450, 36)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
      4 JENIS PAHAT TANGAN DINGIN (COLD CHISELS) &amp; BAHAYA KEPALA JAMUR
    </text>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
      Perkakas Tangan Manual Pemotong &amp; Pengikis Logam, Sudut Baji Potong, dan Standar K3 Bengkel
    </text>
  </g>

  <!-- 4 TYPES OF CHISELS GRID (Top Half) -->
  <g transform="translate(50, 75)">
    <!-- 1. Pahat Pelat / Rata (Flat Chisel) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="185" height="28" rx="8" fill="#334155"/>
      <text x="92" y="19" fill="#f8fafc" font-size="11" font-weight="900" text-anchor="middle">1. Pahat Pelat (Flat)</text>
      <!-- Chisel Drawing -->
      <!-- Striking head -->
      <polygon points="80,45 105,45 100,55 85,55" fill="#94a3b8" stroke="#475569"/>
      <!-- Octagonal body -->
      <rect x="85" y="55" width="15" height="70" fill="url(#chiselSteel)" stroke="#475569"/>
      <!-- Tapered cutting edge -->
      <polygon points="85,125 100,125 105,150 80,150" fill="url(#chiselEdge)" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="78" y1="150" x2="107" y2="150" stroke="#38bdf8" stroke-width="2"/>
      <text x="92" y="165" fill="#38bdf8" font-size="8.5" font-weight="800" text-anchor="middle">Sudut Baji: 60°</text>
      <text x="92" y="177" fill="#94a3b8" font-size="7.5" text-anchor="middle">Meratakan bidang, memotong pelat</text>
    </g>

    <!-- 2. Pahat Alur (Cross-Cut / Cape Chisel) -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="185" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="185" height="28" rx="8" fill="#334155"/>
      <text x="92" y="19" fill="#f8fafc" font-size="11" font-weight="900" text-anchor="middle">2. Pahat Alur (Cape)</text>
      <!-- Chisel Drawing -->
      <polygon points="80,45 105,45 100,55 85,55" fill="#94a3b8" stroke="#475569"/>
      <rect x="85" y="55" width="15" height="70" fill="url(#chiselSteel)" stroke="#475569"/>
      <!-- Narrow wedge for slot cutting -->
      <polygon points="85,125 100,125 96,150 89,150" fill="url(#chiselEdge)" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="88" y1="150" x2="97" y2="150" stroke="#f97316" stroke-width="2.5"/>
      <text x="92" y="165" fill="#f97316" font-size="8.5" font-weight="800" text-anchor="middle">Mata Potong Sempit</text>
      <text x="92" y="177" fill="#94a3b8" font-size="7.5" text-anchor="middle">Alur pasak, kanal oli, celah sempit</text>
    </g>

    <!-- 3. Pahat Setengah Bulat (Half-Round Chisel) -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="185" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="185" height="28" rx="8" fill="#334155"/>
      <text x="92" y="19" fill="#f8fafc" font-size="11" font-weight="900" text-anchor="middle">3. Setengah Bulat (Gouge)</text>
      <!-- Chisel Drawing -->
      <polygon points="80,45 105,45 100,55 85,55" fill="#94a3b8" stroke="#475569"/>
      <rect x="85" y="55" width="15" height="70" fill="url(#chiselSteel)" stroke="#475569"/>
      <!-- Rounded tip -->
      <path d="M 85,125 L 100,125 C 100,145 92,150 92,150 C 92,150 85,145 85,125 Z" fill="url(#chiselEdge)" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 86,145 Q 92.5,152 99,145" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <text x="92" y="165" fill="#22c55e" font-size="8.5" font-weight="800" text-anchor="middle">Ujung Lengkung Radius</text>
      <text x="92" y="177" fill="#94a3b8" font-size="7.5" text-anchor="middle">Alur lengkung oli bearing &amp; fillet</text>
    </g>

    <!-- 4. Pahat Intan / Runcing (Diamond Point) -->
    <g transform="translate(615, 0)">
      <rect x="0" y="0" width="185" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="185" height="28" rx="8" fill="#334155"/>
      <text x="92" y="19" fill="#f8fafc" font-size="11" font-weight="900" text-anchor="middle">4. Pahat Intan (Diamond)</text>
      <!-- Chisel Drawing -->
      <polygon points="80,45 105,45 100,55 85,55" fill="#94a3b8" stroke="#475569"/>
      <rect x="85" y="55" width="15" height="70" fill="url(#chiselSteel)" stroke="#475569"/>
      <!-- Diamond V tip -->
      <polygon points="85,125 100,125 92.5,152" fill="url(#chiselEdge)" stroke="#cbd5e1" stroke-width="1.2"/>
      <polygon points="90,145 95,145 92.5,152" fill="#a855f7" stroke="#e9d5ff" stroke-width="1"/>
      <text x="92" y="165" fill="#a855f7" font-size="8.5" font-weight="800" text-anchor="middle">Mata Sudut V Intan</text>
      <text x="92" y="177" fill="#94a3b8" font-size="7.5" text-anchor="middle">Membersihkan sudut siku mati 90°</text>
    </g>
  </g>

  <!-- BOTTOM HALF: K3 BAHAYA FATAL KEPALA JAMUR (MUSHROOM HEAD) -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="800" height="215" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <path d="M 0,0 L 800,0 L 800,36 L 0,36 Z" fill="url(#dangerMushroom)" rx="10"/>
    <text x="20" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff">
      ⚠️ PERINGATAN K3 FATAL: BAHAYA KEPALA JAMUR (MUSHROOMED HEAD) PADA PAHAT TANGAN
    </text>

    <!-- Side 1: Visual Bahaya Serpihan Peluru -->
    <g transform="translate(25, 52)">
      <!-- Chisel with mushroom head -->
      <rect x="0" y="0" width="220" height="145" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="110" y="20" fill="#f87171" font-size="10.5" font-weight="900" text-anchor="middle">❌ KEPALA RUSAK (JAMUR)</text>
      
      <!-- Mushroom Head Graphic -->
      <g transform="translate(110, 40)">
        <!-- Mushroomed striking head with sharp cracks -->
        <path d="M -25,0 C -35,-8 -15,-15 0,-15 C 15,-15 35,-8 25,0 L 15,10 L -15,10 Z" fill="#991b1b" stroke="#fca5a5" stroke-width="1.5"/>
        <line x1="-20" y1="-5" x2="-35" y2="-12" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
        <line x1="20" y1="-5" x2="35" y2="-12" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
        <!-- Flying projectile shrapnel -->
        <polygon points="45,-15 50,-12 47,-18" fill="#fef08a"/>
        <polygon points="-45,-10 -50,-6 -47,-15" fill="#fef08a"/>
        <!-- Chisel body -->
        <rect x="-10" y="10" width="20" height="45" fill="#64748b"/>
        <!-- Hammer striking -->
        <rect x="-20" y="-35" width="40" height="15" rx="3" fill="#cbd5e1" stroke="#334155"/>
        <line x1="0" y1="-20" x2="0" y2="-15" stroke="#ef4444" stroke-width="2"/>
      </g>
      <text x="110" y="125" fill="#fca5a5" font-size="8.5" font-weight="800" text-anchor="middle">Serpihan baja melesat > 100 km/jam!</text>
      <text x="110" y="137" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Menembus kornea mata &amp; leher</text>
    </g>

    <!-- Side 2: Visual Kepala Sehat (Chamfered Head) -->
    <g transform="translate(265, 52)">
      <rect x="0" y="0" width="220" height="145" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="110" y="20" fill="#4ade80" font-size="10.5" font-weight="900" text-anchor="middle">✓ KEPALA STANDAR AMAN</text>
      
      <!-- Chamfered Head Graphic -->
      <g transform="translate(110, 40)">
        <!-- Clean chamfered crown -->
        <polygon points="-12,0 -8,-10 8,-10 12,0 10,10 -10,10" fill="#334155" stroke="#4ade80" stroke-width="1.5"/>
        <circle cx="0" cy="-5" r="2" fill="#4ade80"/>
        <!-- Chisel body -->
        <rect x="-10" y="10" width="20" height="45" fill="#64748b"/>
        <!-- Hammer strike aligned -->
        <rect x="-20" y="-32" width="40" height="15" rx="3" fill="#cbd5e1" stroke="#334155"/>
      </g>
      <text x="110" y="125" fill="#86efac" font-size="8.5" font-weight="800" text-anchor="middle">Kepala di-chamfer 1 - 2 mm</text>
      <text x="110" y="137" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Pukulan palu tepat di titik sumbu</text>
    </g>

    <!-- Side 3: Aturan SOP Pemeliharaan -->
    <g transform="translate(505, 52)">
      <rect x="0" y="0" width="270" height="145" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="16" y="22" fill="#f8fafc" font-size="10.5" font-weight="900">SOP Pemeliharaan Wajib:</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="9">
        1. <tspan fill="#f87171" font-weight="700">Periksa harian:</tspan> Sebelum dipakai, raba
      </text>
      <text x="28" y="58" fill="#94a3b8" font-size="8.5">kepala pahat; jika mekar, JANGAN PAKAI!</text>

      <text x="16" y="78" fill="#cbd5e1" font-size="9">
        2. <tspan fill="#38bdf8" font-weight="700">Gerinda Ulang (Dressing):</tspan> Asah kepala
      </text>
      <text x="28" y="92" fill="#94a3b8" font-size="8.5">membentuk tirus (chamfer) di gerinda duduk.</text>

      <text x="16" y="112" fill="#cbd5e1" font-size="9">
        3. <tspan fill="#facc15" font-weight="700">Gunakan Sarung Pelindung:</tspan> Pakai rubber
      </text>
      <text x="28" y="126" fill="#94a3b8" font-size="8.5">hand-guard penahan benturan salah pukul palu.</text>
    </g>
  </g>
</svg>
