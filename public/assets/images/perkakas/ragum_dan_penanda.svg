<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="viseCast" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="copperJaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="steelBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(450, 36)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
      RAGUM KERJA BANGKU (BENCH VISE) &amp; PERKAKAS PENANDA / PENGGORES
    </text>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle">
      Pencekaman Presisi dengan Pelindung Rahang Lunak (Soft Jaws), Penitik Pusat 90°, dan Penggores Baja
    </text>
  </g>

  <!-- LEFT HALF: RAGUM MEJA BANGKU (BENCH VISE) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="380" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0,0 L 380,0 L 380,34 L 0,34 Z" fill="#334155" rx="10"/>
    <text x="16" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#f8fafc">
      🔩 RAGUM MEJA BENGKEL &amp; PELINDUNG RAHANG
    </text>

    <!-- Drawing Bench Vise -->
    <g transform="translate(60, 60)">
      <!-- Workbench Surface -->
      <rect x="-40" y="160" width="330" height="20" rx="3" fill="#78350f" stroke="#92400e"/>
      <text x="120" y="174" fill="#fef3c7" font-size="8.5" font-weight="800" text-anchor="middle">MEJA KERJA BENGKEL (WORKBENCH)</text>

      <!-- Vise Swivel Base -->
      <path d="M 20,160 L 160,160 L 150,135 L 30,135 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <circle cx="90" cy="148" r="6" fill="#cbd5e1"/>

      <!-- Fixed Body / Jaw (Rahang Diam) -->
      <path d="M 90,135 L 140,135 L 140,40 L 105,40 L 95,80 L 40,80 L 40,135 Z" fill="url(#viseCast)" stroke="#64748b" stroke-width="2"/>
      <!-- Anvil Flat Zone -->
      <rect x="110" y="35" width="40" height="10" fill="#94a3b8" stroke="#cbd5e1"/>
      <text x="130" y="30" fill="#38bdf8" font-size="7.5" font-weight="800" text-anchor="middle">Landasan Pukul (Anvil)</text>

      <!-- Movable Jaw (Rahang Geser) -->
      <path d="M 10,40 L 45,40 L 45,110 L -10,110 L -10,80 L 10,40 Z" fill="url(#viseCast)" stroke="#64748b" stroke-width="2"/>

      <!-- Lead Screw & Handle (Poros Ulir & Engkol) -->
      <rect x="-20" y="70" width="130" height="12" rx="2" fill="url(#steelBar)" stroke="#334155"/>
      <!-- Handle sliding rod -->
      <rect x="-26" y="25" width="8" height="100" rx="4" fill="#f1f5f9" stroke="#475569"/>
      <circle cx="-22" cy="27" r="7" fill="#ea580c"/>
      <circle cx="-22" cy="123" r="7" fill="#ea580c"/>

      <!-- Serrated Steel Jaws (Rahang Baja Bergerigi) -->
      <rect x="45" y="40" width="6" height="30" fill="#f8fafc" stroke="#334155"/>
      <rect x="99" y="40" width="6" height="30" fill="#f8fafc" stroke="#334155"/>

      <!-- SOFT JAWS ATTACHMENT (Pelindung Rahang Tembaga/Aluminium) -->
      <path d="M 51,35 L 57,35 L 57,75 L 51,75 Z" fill="url(#copperJaw)" stroke="#f97316"/>
      <path d="M 93,35 L 99,35 L 99,75 L 93,75 Z" fill="url(#copperJaw)" stroke="#f97316"/>
      <!-- Clamped workpiece in between -->
      <rect x="62" y="42" width="26" height="25" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <text x="75" y="58" fill="#ffffff" font-size="7" font-weight="900" text-anchor="middle">BENDA</text>
    </g>

    <!-- Callouts & Technical Notes -->
    <g transform="translate(16, 260)">
      <text x="0" y="14" fill="#fdba74" font-size="10" font-weight="900">🛡️ FUNGSI PELINDUNG RAHANG LUNAK (SOFT JAWS):</text>
      <text x="0" y="32" fill="#cbd5e1" font-size="8.5">
        Rahang asli ragum terbuat dari baja keras dengan gerigi kasar (serrated).
      </text>
      <text x="0" y="48" fill="#cbd5e1" font-size="8.5">
        Menjepit benda kerja halus tanpa soft jaws akan meninggalkan <tspan fill="#f87171" font-weight="700">cacat baret permanen!</tspan>
      </text>
      <text x="0" y="66" fill="#38bdf8" font-size="8.5" font-weight="700">
        • Bahan Soft Jaws: Tembaga, Aluminium, Kuningan, atau Karet Keras.
      </text>
      <text x="0" y="82" fill="#4ade80" font-size="8.5" font-weight="700">
        • Posisi Tinggi Meja Kerja Ideal: Siku lengan tangan lurus setinggi rahang ragum (± 100 - 105 cm dari lantai).
      </text>
      <text x="0" y="98" fill="#94a3b8" font-size="8">
        • Jangan memukul tangkai engkol ragum dengan palu untuk mengencangkan!
      </text>
    </g>
  </g>

  <!-- RIGHT HALF: PERKAKAS PENANDA & PENGGORES (MARKING & LAYOUT TOOLS) -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="380" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0,0 L 380,0 L 380,34 L 0,34 Z" fill="#334155" rx="10"/>
    <text x="16" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#f8fafc">
      📐 PERKAKAS PENANDA, PENGGORES &amp; PENITIK
    </text>

    <!-- 4 Key Layout Tools -->
    <g transform="translate(16, 50)">
      <!-- 1. Center Punch (Penitik Pusat 90°) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="348" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
        <circle cx="28" cy="38" r="18" fill="#38bdf8" opacity="0.2"/>
        <text x="28" y="43" fill="#38bdf8" font-size="14" font-weight="900" text-anchor="middle">90°</text>
        <text x="58" y="24" fill="#f8fafc" font-size="11" font-weight="900">Penitik Pusat (Center Punch 90°)</text>
        <text x="58" y="42" fill="#cbd5e1" font-size="8.5">Sudut ujung tajam: <tspan fill="#38bdf8" font-weight="800">90 Derajat</tspan>.</text>
        <text x="58" y="58" fill="#94a3b8" font-size="8">Fungsi: Menandai titik pusat awal pengeboran agar mata bor tidak bergeser/slip.</text>
      </g>

      <!-- 2. Prick Punch (Penitik Garis 30° - 60°) -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="348" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
        <circle cx="28" cy="38" r="18" fill="#f97316" opacity="0.2"/>
        <text x="28" y="43" fill="#f97316" font-size="13" font-weight="900" text-anchor="middle">30°</text>
        <text x="58" y="24" fill="#f8fafc" font-size="11" font-weight="900">Penitik Garis (Prick Punch 30° - 60°)</text>
        <text x="58" y="42" fill="#cbd5e1" font-size="8.5">Sudut ujung runcing: <tspan fill="#f97316" font-weight="800">30° s.d. 60 Derajat</tspan>.</text>
        <text x="58" y="58" fill="#94a3b8" font-size="8">Fungsi: Menitiki sepanjang garis goresan dan titik tumpu kaki jangka pembagi.</text>
      </g>

      <!-- 3. Penggores Baja (Scriber) -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="348" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
        <circle cx="28" cy="38" r="18" fill="#22c55e" opacity="0.2"/>
        <text x="28" y="44" fill="#22c55e" font-size="16" font-weight="900" text-anchor="middle">🖊️</text>
        <text x="58" y="24" fill="#f8fafc" font-size="11" font-weight="900">Penggores Baja Karbida (Scriber)</text>
        <text x="58" y="42" fill="#cbd5e1" font-size="8.5">Ujung baja perkakas keras / tip tungsten carbide (kekerasan &gt; 65 HRC).</text>
        <text x="58" y="58" fill="#94a3b8" font-size="8">Fungsi: Menggores garis ukuran batas sayat presisi di atas permukaan pelat logam.</text>
      </g>

      <!-- 4. Jangka Gores / Pembagi (Dividers) -->
      <g transform="translate(0, 255)">
        <rect x="0" y="0" width="348" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
        <circle cx="28" cy="38" r="18" fill="#a855f7" opacity="0.2"/>
        <text x="28" y="44" fill="#a855f7" font-size="16" font-weight="900" text-anchor="middle">📐</text>
        <text x="58" y="24" fill="#f8fafc" font-size="11" font-weight="900">Jangka Pembagi Pegas (Spring Dividers)</text>
        <text x="58" y="42" fill="#cbd5e1" font-size="8.5">Dilengkapi busur penyetel mur mikro (knurled nut) untuk presisi 0.1 mm.</text>
        <text x="58" y="58" fill="#94a3b8" font-size="8">Fungsi: Melukis lingkaran, busur radius, serta membagi jarak garis sama panjang.</text>
      </g>
    </g>
  </g>
</svg>
