<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="400" height="32" rx="8" fill="#0f172a"/>
  <rect x="0" y="24" width="400" height="8" fill="#0f172a"/>
  <text x="200" y="21" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">ESTIMASI BIAYA &amp; BOM PROYEK FABRIKASI</text>

  <!-- Content Table Header -->
  <g transform="translate(15, 42)">
    <rect width="370" height="22" rx="4" fill="#e2e8f0"/>
    <text x="15" y="15" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">KOMPONEN BIAYA PRODUKSI</text>
    <text x="240" y="15" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">PORSI</text>
    <text x="320" y="15" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">SUBTOTAL</text>
  </g>

  <!-- Table Rows -->
  <g transform="translate(15, 68)">
    <!-- Row 1: Raw Materials -->
    <rect width="370" height="24" rx="3" fill="#ffffff" stroke="#f1f5f9"/>
    <circle cx="15" cy="12" r="5" fill="#0284c7"/>
    <text x="28" y="15" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Material Utama (Baja Profil, Hollow, Pelat)</text>
    <text x="245" y="15" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">45%</text>
    <text x="315" y="15" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Rp 1.350.000</text>

    <!-- Row 2: Consumables -->
    <g transform="translate(0, 26)">
      <rect width="370" height="24" rx="3" fill="#ffffff" stroke="#f1f5f9"/>
      <circle cx="15" cy="12" r="5" fill="#0d9488"/>
      <text x="28" y="15" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Bahan Habis (Kawat Las, Batu Gerinda, Gas)</text>
      <text x="245" y="15" fill="#0d9488" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">15%</text>
      <text x="315" y="15" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Rp 450.000</text>
    </g>

    <!-- Row 3: Labor & Machine -->
    <g transform="translate(0, 52)">
      <rect width="370" height="24" rx="3" fill="#ffffff" stroke="#f1f5f9"/>
      <circle cx="15" cy="12" r="5" fill="#eab308"/>
      <text x="28" y="15" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Upah Kerja &amp; Daya Mesin (Direct Labor)</text>
      <text x="245" y="15" fill="#ca8a04" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">25%</text>
      <text x="315" y="15" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Rp 750.000</text>
    </g>

    <!-- Row 4: Overhead & Profit -->
    <g transform="translate(0, 78)">
      <rect width="370" height="24" rx="3" fill="#ffffff" stroke="#f1f5f9"/>
      <circle cx="15" cy="12" r="5" fill="#16a34a"/>
      <text x="28" y="15" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Margin Keuntungan Bersih (Net Profit)</text>
      <text x="245" y="15" fill="#16a34a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">15%</text>
      <text x="315" y="15" fill="#475569" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Rp 450.000</text>
    </g>
  </g>

  <!-- Formula Summary Card -->
  <g transform="translate(15, 180)">
    <rect width="370" height="46" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="185" y="18" fill="#1e40af" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">TOTAL HARGA PENAWARAN (HPP + PROFIT): Rp 3.000.000</text>
    <text x="185" y="34" fill="#3b82f6" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Formula: HPP = (BOM Material + Consumables + Tenaga Kerja + Overhead)</text>
  </g>
</svg>
