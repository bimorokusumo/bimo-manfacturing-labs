<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="360" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="360" height="32" rx="8" fill="#1e293b"/>
  <rect x="0" y="24" width="360" height="8" fill="#1e293b"/>
  <text x="180" y="21" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.5">GARIS GORES PUTUS (ISO 128 - TYPE F)</text>

  <!-- Specimen Line Demonstration -->
  <g transform="translate(25, 45)">
    <rect width="310" height="42" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Spesimen Garis Acuan:</text>
    <line x1="15" y1="28" x2="210" y2="28" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 4"/>
    <rect x="225" y="16" width="72" height="20" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="261" y="30" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">0.3 – 0.35 mm</text>
  </g>

  <!-- Engineering Drawing Part Example -->
  <g transform="translate(25, 96)">
    <rect width="310" height="92" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Outer Visible Contour (Thin/Solid) -->
    <rect x="25" y="20" width="125" height="54" rx="2" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Hidden Internal Hole (Stepped counterbore) in DASHED LINES -->
    <line x1="55" y1="20" x2="55" y2="74" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="115" y1="20" x2="115" y2="74" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="75" y1="38" x2="95" y2="38" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Center axis for reference -->
    <line x1="85" y1="12" x2="85" y2="82" stroke="#ef4444" stroke-width="1" stroke-dasharray="10 3 2 3"/>

    <!-- Annotations with Arrow -->
    <path d="M 175 32 L 118 32" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="115" cy="32" r="3" fill="#d97706"/>
    <text x="180" y="32" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">Garis Kontur Terhalang</text>
    <text x="180" y="46" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">(Lubang Tembus di Balik Dinding)</text>

    <path d="M 175 62 L 118 62" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="115" cy="62" r="3" fill="#d97706"/>
    <text x="180" y="64" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Panjang Strip 3–6 mm</text>
    <text x="180" y="77" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Celah antar-strip seragam 1 mm</text>
  </g>
</svg>
