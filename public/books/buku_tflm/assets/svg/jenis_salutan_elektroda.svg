<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <!-- Background -->
  <rect width="540" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="540" height="32" rx="8" fill="#0f172a"/>
  <rect x="0" y="24" width="540" height="8" fill="#0f172a"/>
  <text x="270" y="21" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">PERBANDINGAN 3 KELUARGA SALUTAN FLUKS ELEKTRODA AWS</text>

  <!-- Card 1: Rutile (E6013) -->
  <g transform="translate(15, 45)">
    <rect width="160" height="195" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="160" height="24" rx="6" fill="#0284c7"/>
    <rect y="16" width="160" height="8" fill="#0284c7"/>
    <text x="80" y="16" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">RUTIL (E6013)</text>
    
    <!-- Electrode visual -->
    <rect x="73" y="32" width="14" height="60" fill="#bae6fd" stroke="#0284c7" rx="1"/>
    <rect x="77" y="26" width="6" height="70" fill="#94a3b8"/>
    
    <!-- Specs -->
    <text x="80" y="105" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Titania (TiO₂)</text>
    <rect x="10" y="112" width="140" height="1" fill="#e2e8f0"/>
    <text x="80" y="126" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Busur nyala sangat stabil</text>
    <text x="80" y="139" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Spatter percikan minim</text>
    <text x="80" y="152" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Terak mudah terlepas</text>
    <text x="80" y="165" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Penetrasi: Sedang</text>
    
    <rect x="15" y="174" width="130" height="15" rx="3" fill="#e0f2fe"/>
    <text x="80" y="185" fill="#0369a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Pelat Tipis &amp; Pemula</text>
  </g>

  <!-- Card 2: Cellulose (E6010) -->
  <g transform="translate(190, 45)">
    <rect width="160" height="195" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect width="160" height="24" rx="6" fill="#d97706"/>
    <rect y="16" width="160" height="8" fill="#d97706"/>
    <text x="80" y="16" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SELULOSA (E6010)</text>
    
    <!-- Electrode visual -->
    <rect x="73" y="32" width="14" height="60" fill="#fef3c7" stroke="#d97706" rx="1"/>
    <rect x="77" y="26" width="6" height="70" fill="#94a3b8"/>
    
    <!-- Specs -->
    <text x="80" y="105" fill="#b45309" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Organik Natrium</text>
    <rect x="10" y="112" width="140" height="1" fill="#e2e8f0"/>
    <text x="80" y="126" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Busur semprot keras (digging)</text>
    <text x="80" y="139" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Gas pelindung H₂ &amp; CO tinggi</text>
    <text x="80" y="152" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Terak tipis &amp; cepat beku</text>
    <text x="80" y="165" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Penetrasi: Sangat Dalam</text>
    
    <rect x="15" y="174" width="130" height="15" rx="3" fill="#fef3c7"/>
    <text x="80" y="185" fill="#92400e" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Akar Pipa Migas (Root Pass)</text>
  </g>

  <!-- Card 3: Low Hydrogen (E7018) -->
  <g transform="translate(365, 45)">
    <rect width="160" height="195" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect width="160" height="24" rx="6" fill="#dc2626"/>
    <rect y="16" width="160" height="8" fill="#dc2626"/>
    <text x="80" y="16" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOW HYDROGEN (E7018)</text>
    
    <!-- Electrode visual -->
    <rect x="73" y="32" width="14" height="60" fill="#fee2e2" stroke="#dc2626" rx="1"/>
    <rect x="77" y="26" width="6" height="70" fill="#94a3b8"/>
    
    <!-- Specs -->
    <text x="80" y="105" fill="#b91c1c" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Kalsium Karbonat + Fe</text>
    <rect x="10" y="112" width="140" height="1" fill="#e2e8f0"/>
    <text x="80" y="126" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Bebas difusi hidrogen</text>
    <text x="80" y="139" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Ulet &amp; tahan retak dingin</text>
    <text x="80" y="152" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Logam las kekuatan 70 ksi</text>
    <text x="80" y="165" fill="#334155" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">• Penetrasi: Dalam &amp; Padat</text>
    
    <rect x="15" y="174" width="130" height="15" rx="3" fill="#fee2e2"/>
    <text x="80" y="185" fill="#991b1b" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Bejana Tekan &amp; Jembatan</text>
  </g>
</svg>
