<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <rect width="700" height="240" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <g transform="translate(25, 25)">
    <!-- Card 1: Ringkas -->
    <rect x="0" y="0" width="120" height="190" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="35" rx="8" fill="#3b82f6"/>
    <text x="60" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">RINGKAS</text>
    <text x="60" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">(Seiri / 整理)</text>
    <text x="60" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Pisahkan &amp;</text>
    <text x="60" y="108" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Singkirkan</text>
    <text x="60" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Hanya simpan</text>
    <text x="60" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">barang yang benar-</text>
    <text x="60" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">benar diperlukan.</text>

    <!-- Card 2: Rapi -->
    <rect x="132" y="0" width="120" height="190" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="132" y="0" width="120" height="35" rx="8" fill="#0ea5e9"/>
    <text x="192" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">RAPI</text>
    <text x="192" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">(Seiton / 整頓)</text>
    <text x="192" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Tata &amp;</text>
    <text x="192" y="108" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Beri Label</text>
    <text x="192" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Satu tempat untuk</text>
    <text x="192" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">setiap alat, mudah</text>
    <text x="192" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">diambil dlm 30 dtk.</text>

    <!-- Card 3: Resik -->
    <rect x="264" y="0" width="120" height="190" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="264" y="0" width="120" height="35" rx="8" fill="#10b981"/>
    <text x="324" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">RESIK</text>
    <text x="324" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">(Seiso / 清掃)</text>
    <text x="324" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Bersihkan &amp;</text>
    <text x="324" y="108" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Inspeksi</text>
    <text x="324" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Membersihkan</text>
    <text x="324" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">sekaligus periksa</text>
    <text x="324" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">kebocoran oli/baut.</text>

    <!-- Card 4: Rawat -->
    <rect x="396" y="0" width="120" height="190" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="396" y="0" width="120" height="35" rx="8" fill="#f59e0b"/>
    <text x="456" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">RAWAT</text>
    <text x="456" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">(Seiketsu / 清潔)</text>
    <text x="456" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Standardisasi</text>
    <text x="456" y="108" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Konsisten</text>
    <text x="456" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Pertahankan 3R</text>
    <text x="456" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">sebelumnya melalui</text>
    <text x="456" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">checklist &amp; SOP.</text>

    <!-- Card 5: Rajin -->
    <rect x="528" y="0" width="120" height="190" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <rect x="528" y="0" width="120" height="35" rx="8" fill="#ef4444"/>
    <text x="588" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">RAJIN</text>
    <text x="588" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">(Shitsuke / 躾)</text>
    <text x="588" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Disiplin &amp;</text>
    <text x="588" y="108" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Kebiasaan</text>
    <text x="588" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Jadikan budaya diri</text>
    <text x="588" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">tanpa harus selalu</text>
    <text x="588" y="165" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">disuruh/diawasi.</text>
  </g>
</svg>