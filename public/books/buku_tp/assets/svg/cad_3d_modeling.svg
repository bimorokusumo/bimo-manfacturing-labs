<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" height="100%">
  <rect width="700" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="24" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">PEMODELAN PARAMETRIK 3D CAD: SOLID MODELING &amp; FEATURE TREE</text>

  <!-- Left: CAD Browser / Feature Tree -->
  <g transform="translate(25, 38)">
    <rect width="170" height="175" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="25" rx="6" fill="#0284c7"/>
    <text x="10" y="17" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Model Browser (Tree)</text>
    <g transform="translate(15, 38)">
      <text x="0" y="12" fill="#38bdf8" font-family="sans-serif" font-size="9">&#128193; Bearing_Housing.ipt</text>
      <text x="10" y="32" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8862; Origin Planes (XY, YZ)</text>
      <text x="10" y="52" fill="#f59e0b" font-family="sans-serif" font-size="8.5">&#9654; Extrusion 1 (Base 120x80)</text>
      <text x="10" y="72" fill="#10b981" font-family="sans-serif" font-size="8.5">&#9654; Revolve 1 (Bore Ø52)</text>
      <text x="10" y="92" fill="#38bdf8" font-family="sans-serif" font-size="8.5">&#9654; Hole 1 (4x M8 Baut)</text>
      <text x="10" y="112" fill="#ec4899" font-family="sans-serif" font-size="8.5">&#9654; Fillet 1 (R5 Rad)</text>
      <text x="10" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">&#10003; Fully Constrained</text>
    </g>
  </g>

  <!-- Right: 3D Isometric Solid Model Render -->
  <g transform="translate(210, 38)">
    <rect width="465" height="175" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- 3D Solid Housing Rendering with Gradients -->
    <defs>
      <linearGradient id="cadTop" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <linearGradient id="cadSide" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0284c7"/>
        <stop offset="100%" stop-color="#075985"/>
      </linearGradient>
    </defs>
    <!-- Isometric Cube / Flange Base -->
    <polygon points="230,45 340,95 230,145 120,95" fill="url(#cadTop)" stroke="#e0f2fe" stroke-width="1.2"/>
    <polygon points="120,95 230,145 230,165 120,115" fill="url(#cadSide)" stroke="#0369a1" stroke-width="1"/>
    <polygon points="230,145 340,95 340,115 230,165" fill="#0c4a6e" stroke="#0369a1" stroke-width="1"/>
    <!-- Cylinder Boss in center -->
    <ellipse cx="230" cy="80" rx="50" ry="25" fill="url(#cadTop)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 180 80 L 180 115 A 50 25 0 0 0 280 115 L 280 80 Z" fill="url(#cadSide)" stroke="#0284c7" stroke-width="1"/>
    <!-- Center Bore Hole -->
    <ellipse cx="230" cy="80" rx="26" ry="13" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Bolt holes -->
    <ellipse cx="150" cy="88" rx="8" ry="4" fill="#082f49" stroke="#ffffff" stroke-width="1"/>
    <ellipse cx="310" cy="88" rx="8" ry="4" fill="#082f49" stroke="#ffffff" stroke-width="1"/>

    <!-- CAD Coordinates Triad (X, Y, Z) -->
    <g transform="translate(400, 140)">
      <line x1="20" y1="20" x2="45" y2="10" stroke="#ef4444" stroke-width="2.5"/>
      <text x="48" y="12" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="bold">X</text>
      <line x1="20" y1="20" x2="20" y2="-8" stroke="#10b981" stroke-width="2.5"/>
      <text x="16" y="-11" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold">Y</text>
      <line x1="20" y1="20" x2="-2" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="-8" y="32" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Z</text>
    </g>
    <!-- Label -->
    <text x="30" y="25" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Autodesk Inventor / SolidWorks Part Modeling</text>
  </g>
</svg>