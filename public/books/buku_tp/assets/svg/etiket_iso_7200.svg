<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" height="100%">
  <rect width="700" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="24" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">STANDAR KEPALA GAMBAR (ETIKET) ISO 7200 (LEBAR 180 mm)</text>

  <!-- Title Block ISO 7200 Table -->
  <g transform="translate(25, 42)">
    <!-- Outer Border -->
    <rect width="650" height="165" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>

    <!-- Internal Lines according to ISO 7200 standard layout -->
    <line x1="0" y1="45" x2="650" y2="45" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="85" x2="650" y2="85" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="125" x2="650" y2="125" stroke="#000000" stroke-width="1.5"/>

    <!-- Vertical dividers -->
    <line x1="380" y1="0" x2="380" y2="125" stroke="#000000" stroke-width="1.5"/>
    <line x1="500" y1="0" x2="500" y2="85" stroke="#000000" stroke-width="1.5"/>
    <line x1="220" y1="85" x2="220" y2="165" stroke="#000000" stroke-width="1.5"/>
    <line x1="500" y1="125" x2="500" y2="165" stroke="#000000" stroke-width="1.5"/>

    <!-- Contents: Row 1 -->
    <text x="15" y="20" fill="#475569" font-family="sans-serif" font-size="9">INSTANSI / SEKOLAH:</text>
    <text x="15" y="37" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">SMK NEGERI 2 DEPOK SLEMAN</text>

    <text x="395" y="20" fill="#475569" font-family="sans-serif" font-size="9">SKALA:</text>
    <text x="425" y="37" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">1 : 1</text>

    <text x="515" y="20" fill="#475569" font-family="sans-serif" font-size="9">SATUAN / UKURAN KERTAS:</text>
    <text x="535" y="37" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">mm / A4</text>

    <!-- Row 2 -->
    <text x="15" y="60" fill="#475569" font-family="sans-serif" font-size="9">JUDUL GAMBAR KERJA:</text>
    <text x="15" y="77" fill="#0284c7" font-family="sans-serif" font-size="14" font-weight="bold">POROS BERTINGKAT &amp; RODA GIGI LURUS</text>

    <text x="395" y="60" fill="#475569" font-family="sans-serif" font-size="9">SIMBOL PROYEKSI:</text>
    <!-- ISO Projection Symbol (First Angle / European Projection Cone) -->
    <g transform="translate(435, 60)">
      <circle cx="10" cy="12" r="5" fill="none" stroke="#000000" stroke-width="1.2"/>
      <circle cx="10" cy="12" r="10" fill="none" stroke="#000000" stroke-width="1.2"/>
      <line x1="-5" y1="12" x2="25" y2="12" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
      <line x1="10" y1="-3" x2="10" y2="27" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
      <polygon points="32,5 48,2 48,22 32,19" fill="none" stroke="#000000" stroke-width="1.2"/>
      <line x1="28" y1="12" x2="52" y2="12" stroke="#000000" stroke-width="0.8" stroke-dasharray="4 2"/>
    </g>

    <text x="515" y="60" fill="#475569" font-family="sans-serif" font-size="9">TANGGAL SELESAI:</text>
    <text x="515" y="77" fill="#0f172a" font-family="sans-serif" font-size="11">08 September 2026</text>

    <!-- Row 3 -->
    <text x="15" y="102" fill="#475569" font-family="sans-serif" font-size="9">DIGAMBAR OLEH:</text>
    <text x="15" y="117" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Peserta Didik Fase E Teknik Mesin</text>

    <text x="235" y="102" fill="#475569" font-family="sans-serif" font-size="9">DIPERIKSA OLEH (GURU PENGAMPU):</text>
    <text x="235" y="117" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Bimoro Kusumo, S.Pd.</text>

    <text x="395" y="102" fill="#475569" font-family="sans-serif" font-size="9">NO. GAMBAR:</text>
    <text x="395" y="117" fill="#b91c1c" font-family="sans-serif" font-size="12" font-weight="bold">TM-X-001/2026</text>

    <!-- Row 4 -->
    <text x="15" y="145" fill="#475569" font-family="sans-serif" font-size="9">KETERANGAN / TOLERANSI UMUM:</text>
    <text x="15" y="158" fill="#0f172a" font-family="sans-serif" font-size="10">ISO 2768-m (Sedang) | Sudut Bebas R1 | Ra = 1.6 &#181;m</text>

    <text x="235" y="145" fill="#475569" font-family="sans-serif" font-size="9">STATUS GAMBAR:</text>
    <text x="235" y="158" fill="#047857" font-family="sans-serif" font-size="10" font-weight="bold">APPROVED FOR MACHINING (DISETUJUI)</text>

    <text x="515" y="145" fill="#475569" font-family="sans-serif" font-size="9">LEMBAR:</text>
    <text x="555" y="158" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">1 / 1</text>
  </g>
</svg>