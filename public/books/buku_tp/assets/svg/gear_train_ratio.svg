<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <rect width="820" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="25" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">KINEMATIKA RODA GIGI &amp; PERHITUNGAN RASIO REDUKSI PUTARAN</text>

  <g transform="translate(30, 42)">
    <!-- Skema Gigi Penggerak &amp; Digerakkan -->
    <rect x="0" y="0" width="460" height="158" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="26" rx="8" fill="#1d4ed8"/>
    <text x="230" y="18" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">SKEMA TRANSMISI RODA GIGI LURUS (SPUR GEAR MESH)</text>

    <!-- Gear 1 (Driver / Penggerak) -->
    <circle cx="110" cy="95" r="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="110" cy="95" r="8" fill="#1e293b"/>
    <text x="110" y="65" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="10" font-weight="bold">Driver (Z₁ = 20)</text>
    <text x="110" y="132" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="10">n₁ = 1400 rpm (CW)</text>

    <!-- Gear 2 (Driven / Digerakkan) -->
    <circle cx="270" cy="95" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="3" stroke-dasharray="8 5"/>
    <circle cx="270" cy="95" r="12" fill="#1e293b"/>
    <text x="270" y="45" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold">Driven (Z₂ = 60)</text>
    <text x="270" y="148" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="10">n₂ = 466.7 rpm (CCW)</text>

    <!-- Titik Kontak Mesh -->
    <circle cx="180" cy="95" r="4" fill="#dc2626"/>
    <text x="180" y="85" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="bold">Titik Mesh</text>

    <!-- Arah Putaran Arrows -->
    <path d="M 90,65 A 30 30 0 0 1 130,65" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Box Rumus Matematika Rasio -->
  <g transform="translate(510, 42)">
    <rect x="0" y="0" width="280" height="158" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="26" rx="8" fill="#047857"/>
    <text x="140" y="18" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">RUMUS RASIO TRANSMISI (i)</text>

    <text x="20" y="52" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">i = n₁ / n₂ = Z₂ / Z₁</text>
    <text x="20" y="74" fill="#475569" font-family="sans-serif" font-size="10">Contoh Hitung Reduksi 1:3:</text>
    <text x="20" y="94" fill="#047857" font-family="sans-serif" font-size="11" font-weight="bold">i = 60 / 20 = 3,0</text>
    <text x="20" y="114" fill="#334155" font-family="sans-serif" font-size="10">n₂ = n₁ / i = 1400 / 3 = 466,7 rpm</text>
    <text x="20" y="138" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold">Torsi Naik 3× Lipat (T₂ = 3 × T₁)!</text>
  </g>
</svg>