<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <rect width="900" height="220" rx="12" fill="#0f172a"/>
  <!-- Steps -->
  <g transform="translate(30, 30)">
    <!-- 1 Sensor -->
    <rect x="0" y="0" width="150" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="75" cy="45" r="22" fill="#0284c7"/>
    <text x="75" y="51" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">📡</text>
    <text x="75" y="90" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">1. SENSOR MESIN</text>
    <text x="75" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Suhu Spindle</text>
    <text x="75" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Akselerometer Getaran</text>
    <text x="75" y="144" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Arus Motor &amp; Level Oli</text>

    <!-- Arrow 1 -->
    <path d="M 160 80 L 185 80" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- 2 Edge/Gateway -->
    <rect x="190" y="0" width="150" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="265" cy="45" r="22" fill="#0369a1"/>
    <text x="265" y="51" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">📶</text>
    <text x="265" y="90" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">2. EDGE / GATEWAY</text>
    <text x="265" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Raspberry Pi / PLC</text>
    <text x="265" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Konversi Sinyal ADC</text>
    <text x="265" y="144" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Filter Noise &amp; MQTT</text>

    <!-- Arrow 2 -->
    <path d="M 350 80 L 375 80" stroke="#38bdf8" stroke-width="3"/>

    <!-- 3 Cloud Database -->
    <rect x="380" y="0" width="150" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="455" cy="45" r="22" fill="#0284c7"/>
    <text x="455" y="51" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">☁️</text>
    <text x="455" y="90" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">3. CLOUD SERVER</text>
    <text x="455" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Penyimpanan Big Data</text>
    <text x="455" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Time-series Database</text>
    <text x="455" y="144" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Log Riwayat Mesin</text>

    <!-- Arrow 3 -->
    <path d="M 540 80 L 565 80" stroke="#f59e0b" stroke-width="3"/>

    <!-- 4 AI Analysis -->
    <rect x="570" y="0" width="145" height="160" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="642" cy="45" r="22" fill="#d97706"/>
    <text x="642" y="51" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">🧠</text>
    <text x="642" y="90" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">4. AI &amp; ANALISIS</text>
    <text x="642" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Machine Learning</text>
    <text x="642" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Deteksi Anomali Getar</text>
    <text x="642" y="144" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Prediksi Umur Pahat</text>

    <!-- Arrow 4 -->
    <path d="M 725 80 L 750 80" stroke="#10b981" stroke-width="3"/>

    <!-- 5 Action &amp; Dashboard -->
    <rect x="755" y="0" width="135" height="160" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="822" cy="45" r="22" fill="#059669"/>
    <text x="822" y="51" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">📱</text>
    <text x="822" y="90" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">5. DASHBOARD &amp; AKSI</text>
    <text x="822" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Notifikasi Teknisi</text>
    <text x="822" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Auto Shut-off Darurat</text>
    <text x="822" y="144" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Pergantian Terencana</text>
  </g>
</svg>