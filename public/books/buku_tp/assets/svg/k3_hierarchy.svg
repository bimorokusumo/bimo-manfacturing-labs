<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <filter id="shdw"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="700" height="280" rx="10" fill="#f8fafc"/>
  <text x="350" y="32" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="bold">HIRARKI PENGENDALIAN RISIKO K3 (ISO 45001)</text>

  <!-- Inverted Trapezoids / Pyramid -->
  <!-- Level 1: Elimination -->
  <polygon points="120,50 580,50 550,85 150,85" fill="#059669" filter="url(#shdw)"/>
  <text x="350" y="72" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">1. ELIMINASI (Menghilangkan bahaya secara total fisik)</text>

  <!-- Level 2: Substitution -->
  <polygon points="155,90 545,90 515,125 185,125" fill="#10b981" filter="url(#shdw)"/>
  <text x="350" y="112" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">2. SUBSTITUSI (Mengganti bahan/proses berbahaya dengan yang lebih aman)</text>

  <!-- Level 3: Engineering Controls -->
  <polygon points="190,130 510,130 480,165 220,165" fill="#f59e0b" filter="url(#shdw)"/>
  <text x="350" y="152" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">3. REKAYASA TEKNIK (Memasang penutup mesin, ventilasi, interlock switch)</text>

  <!-- Level 4: Administrative Controls -->
  <polygon points="225,170 475,170 445,205 255,205" fill="#f97316" filter="url(#shdw)"/>
  <text x="350" y="192" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">4. KONTROL ADMINISTRATIF (SOP, rambu K3, pelatihan, rotasi kerja)</text>

  <!-- Level 5: PPE -->
  <polygon points="260,210 440,210 400,245 300,245" fill="#ef4444" filter="url(#shdw)"/>
  <text x="350" y="232" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">5. APD (Alat Pelindung Diri - Pertahanan Terakhir)</text>

  <!-- Left Side Arrow -->
  <path d="M 70 50 L 70 245" stroke="#3b82f6" stroke-width="4"/>
  <polygon points="64,60 70,45 76,60" fill="#3b82f6"/>
  <text x="50" y="150" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="bold" transform="rotate(-90 50 150)">EFEKTIVITAS TERTINGGI</text>
</svg>