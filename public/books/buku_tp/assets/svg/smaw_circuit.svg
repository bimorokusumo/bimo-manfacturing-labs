<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 260" width="100%" height="100%">
  <rect width="750" height="260" rx="10" fill="#0f172a"/>
  <text x="375" y="28" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">SIRKUIT PENGELASAN SMAW (SHIELDED METAL ARC WELDING)</text>

  <!-- Welding Machine -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="35" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">MESIN LAS</text>
    <text x="80" y="55" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Trafo / Inverter</text>
    <circle cx="45" cy="110" r="12" fill="#ef4444"/>
    <text x="45" y="115" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">+</text>
    <circle cx="115" cy="110" r="12" fill="#3b82f6"/>
    <text x="115" y="114" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">-</text>
  </g>

  <!-- Electrode Cable (+) -->
  <path d="M 95 170 Q 180 230 350 140" fill="none" stroke="#ef4444" stroke-width="4"/>
  <!-- Electrode Holder -->
  <g transform="translate(340, 100) rotate(35)">
    <rect x="0" y="0" width="60" height="18" rx="3" fill="#334155" stroke="#64748b"/>
    <!-- Electrode Rod -->
    <line x1="60" y1="9" x2="130" y2="9" stroke="#94a3b8" stroke-width="4"/>
    <!-- Flux coating -->
    <rect x="65" y="6" width="55" height="6" fill="#78716c"/>
  </g>

  <!-- Workpiece -->
  <g transform="translate(440, 160)">
    <rect x="0" y="20" width="240" height="30" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <text x="120" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Benda Kerja (Logam Induk)</text>
    <!-- Arc Glow -->
    <circle cx="50" cy="20" r="16" fill="#fef08a" opacity="0.7"/>
    <polygon points="45,20 52,10 50,22 56,15 48,25" fill="#ffffff"/>
    <text x="50" y="-10" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="12" font-weight="bold">Busur Listrik (Arc ~3500°C)</text>
  </g>

  <!-- Work Cable Ground (-) -->
  <path d="M 165 170 Q 300 240 560 190" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <rect x="550" y="180" width="25" height="15" fill="#3b82f6" rx="2"/>
  <text x="600" y="215" fill="#93c5fd" font-family="sans-serif" font-size="11">Klem Masa (Ground Clamp)</text>
</svg>