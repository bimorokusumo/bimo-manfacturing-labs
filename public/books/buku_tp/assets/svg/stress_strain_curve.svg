<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="100%" height="100%">
  <rect width="820" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="25" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">KURVA TEGANGAN - REGANGAN (STRESS - STRAIN CURVE) BAJA STRUKTURAL</text>
  
  <!-- Sumbu Koordinat -->
  <g transform="translate(60, 40)">
    <!-- Axes -->
    <line x1="40" y1="160" x2="680" y2="160" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="160" x2="40" y2="10" stroke="#334155" stroke-width="2"/>
    
    <!-- Panah Axis -->
    <polygon points="680,157 690,160 680,163" fill="#334155"/>
    <polygon points="37,10 40,0 43,10" fill="#334155"/>
    
    <!-- Label Sumbu -->
    <text x="685" y="178" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold">Regangan (Strain) ε</text>
    <text x="15" y="10" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold" transform="rotate(-90 20 15)">Tegangan (Stress) σ [N/mm²]</text>

    <!-- Daerah Elastis Shading -->
    <rect x="40" y="10" width="90" height="150" fill="#38bdf8" opacity="0.12"/>
    <line x1="130" y1="10" x2="130" y2="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="85" y="150" text-anchor="middle" fill="#0284c7" font-family="sans-serif" font-size="10" font-weight="bold">Daerah Elastis (Hooke)</text>

    <!-- Daerah Plastis Shading -->
    <rect x="130" y="10" width="510" height="150" fill="#f59e0b" opacity="0.08"/>
    <text x="385" y="150" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold">Daerah Deformasi Plastis (Permanen)</text>

    <!-- Kurva Material -->
    <path d="M 40,160 L 115,65 Q 125,60 135,70 Q 155,75 190,65 Q 360,18 480,22 Q 580,26 640,75" fill="none" stroke="#2563eb" stroke-width="3.5"/>

    <!-- Poin-Poin Kunci -->
    <!-- A: Batas Proporsional -->
    <circle cx="115" cy="65" r="4" fill="#0284c7"/>
    <text x="110" y="55" text-anchor="end" fill="#0369a1" font-family="sans-serif" font-size="10" font-weight="bold">σp (Batas Proporsional)</text>

    <!-- B: Titik Luluh (Yield Point) -->
    <circle cx="135" cy="70" r="4.5" fill="#d97706"/>
    <line x1="40" y1="70" x2="135" y2="70" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="145" y="65" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold">σy (Titik Luluh / Yield Strength)</text>

    <!-- C: Ultimate Tensile Strength (UTS) -->
    <circle cx="480" cy="22" r="5" fill="#dc2626"/>
    <line x1="40" y1="22" x2="480" y2="22" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="480" y="14" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="bold">σu (Kekuatan Tarik Maksimum / UTS)</text>

    <!-- D: Titik Putus (Fracture) -->
    <circle cx="640" cy="75" r="5" fill="#7f1d1d"/>
    <text x="645" y="92" fill="#7f1d1d" font-family="sans-serif" font-size="10" font-weight="bold">Titik Putus (Fracture)</text>
    <text x="560" y="50" fill="#475569" font-family="sans-serif" font-size="9" font-style="italic">Fenomena Necking</text>
  </g>
</svg>