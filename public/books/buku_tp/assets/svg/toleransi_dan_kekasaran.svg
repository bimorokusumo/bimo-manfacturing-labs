<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="100%" height="100%">
  <rect width="700" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="24" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">SIMBOL KEKASARAN PERMUKAAN (ISO 1302) &amp; TOLERANSI GEOMETRIS (ISO 1101)</text>

  <!-- Left: Simbol Kekasaran Permukaan ISO 1302 -->
  <g transform="translate(25, 38)">
    <rect width="310" height="175" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
    <text x="155" y="20" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Simbol Kekasaran Permukaan (Surface Roughness)</text>

    <!-- Large ISO Tick Mark Symbol -->
    <g transform="translate(45, 35)">
      <line x1="15" y1="45" x2="35" y2="90" stroke="#f8fafc" stroke-width="3"/>
      <line x1="35" y1="90" x2="70" y2="15" stroke="#f8fafc" stroke-width="3"/>
      <line x1="70" y1="15" x2="140" y2="15" stroke="#f8fafc" stroke-width="3"/>
      <!-- Values on symbol -->
      <text x="75" y="10" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">Bubut / Frais</text>
      <text x="55" y="45" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">Ra 1.6</text>
      <text x="80" y="32" fill="#10b981" font-family="sans-serif" font-size="10">0.8</text>
      <text x="60" y="72" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">=</text>
    </g>

    <!-- Annotations -->
    <g transform="translate(15, 110)">
      <text x="10" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#f59e0b" font-weight="bold">• Ra 1.6 (N7):</tspan> Nilai kekasaran rata-rata aritmetik (&#181;m)</text>
      <text x="10" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#ef4444" font-weight="bold">• Metode Proses:</tspan> Harus dibuang tatal (Machined)</text>
      <text x="10" y="45" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#10b981" font-weight="bold">• 0.8 mm:</tspan> Panjang sampel evaluasi (Sampling length)</text>
      <text x="10" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#38bdf8" font-weight="bold">• Simbol (=):</tspan> Arah bekas pengerjaan sejajar bidang</text>
    </g>
  </g>

  <!-- Right: Toleransi Geometris ISO 1101 -->
  <g transform="translate(355, 38)">
    <rect width="320" height="175" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="160" y="20" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Kotak Toleransi Geometris (Feature Control Frame)</text>

    <!-- Feature Control Frame Box -->
    <g transform="translate(30, 40)">
      <!-- 3 compartments: Symbol, Tolerance value, Datum -->
      <rect x="0" y="0" width="260" height="35" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <line x1="60" y1="0" x2="60" y2="35" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="190" y1="0" x2="190" y2="35" stroke="#f59e0b" stroke-width="1.5"/>

      <!-- Compartment 1: Parallelism symbol -->
      <line x1="22" y1="10" x2="38" y2="25" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="28" y1="10" x2="44" y2="25" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Compartment 2: Tolerance value -->
      <text x="125" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">&#8960; 0.02</text>

      <!-- Compartment 3: Datum reference -->
      <text x="225" y="23" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">A</text>
    </g>

    <!-- Explanations below -->
    <g transform="translate(30, 95)">
      <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#38bdf8" font-weight="bold">1. Karakteristik (//):</tspan> Simbol Kesejajaran (Parallelism)</text>
      <text x="0" y="32" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#ffffff" font-weight="bold">2. Nilai Toleransi:</tspan> Deviasi maks 0.02 mm dlm silinder &#8960;</text>
      <text x="0" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="8.5"><tspan fill="#10b981" font-weight="bold">3. Datum A:</tspan> Bidang acuan referensi dasar pengukuran</text>
      <text x="0" y="66" fill="#94a3b8" font-family="sans-serif" font-size="8">Contoh lain: &#8869; (Tegak lurus), &#9675; (Kebulatan), &#8981; (Posisi)</text>
    </g>
  </g>
</svg>