  <!-- Result Box -->
  <g transform="translate(250, 185)">
    <rect x="0" y="0" width="300" height="42" rx="6" fill="#1e293b"/>
    <text x="150" y="26" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Hasil = 25 mm + (8 × 0,05 mm) = 25,40 mm</text>
