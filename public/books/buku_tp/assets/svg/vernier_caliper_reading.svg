    <line x1="136.4" y1="0" x2="136.4" y2="50" stroke="#16a34a" stroke-width="2"/>
    <text x="136.4" y="-8" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="11" font-weight="bold">Nol Nonius lewat 25 mm</text>
