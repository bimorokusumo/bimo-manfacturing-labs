<line x1="288.8" y1="0" x2="288.8" y2="12" stroke="#2563eb" stroke-width="1.2"/>
<line x1="304.0" y1="0" x2="304.0" y2="20" stroke="#2563eb" stroke-width="1.2"/>
<text x="304.0" y="34" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="10">10</text>

      <!-- Mark line 8 (div 8 = 0.40 mm) matching! -->
