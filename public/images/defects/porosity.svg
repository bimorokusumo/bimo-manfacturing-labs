<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weldBead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="2" rx="12" />

  <!-- Header Banner -->
  <rect x="40" y="40" width="720" height="50" fill="#1e1e2e" rx="8" />
  <circle cx="65" cy="65" r="8" fill="#ef4444" filter="url(#glow)" />
  <text x="85" y="72" fill="#ef4444" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    CACAT LAS: POROSITY (KEROPOS)
  </text>

  <!-- Steel Base Plates -->
  <rect x="60" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />
  <rect x="420" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />
  
  <!-- Groove bevel lines -->
  <path d="M 380 260 L 390 370 L 410 370 L 420 260 Z" fill="#0f172a" />

  <!-- Weld Bead Layer -->
  <path d="M 350 260 Q 400 180 450 260 Q 400 280 350 260 Z" fill="url(#weldBead)" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Weld Ripples -->
  <path d="M 365 245 C 385 230, 415 230, 435 245" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  <path d="M 370 230 C 388 215, 412 215, 430 230" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  <path d="M 378 215 C 392 205, 408 205, 422 215" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />

  <!-- Porosity Pinholes / Gas Voids -->
  <!-- Surface pinholes -->
  <circle cx="390" cy="225" r="7" fill="#020617" stroke="#ef4444" stroke-width="2" />
  <circle cx="415" cy="210" r="10" fill="#020617" stroke="#ef4444" stroke-width="2" />
  <circle cx="400" cy="245" r="6" fill="#020617" stroke="#ef4444" stroke-width="2" />
  <circle cx="425" cy="235" r="8" fill="#020617" stroke="#ef4444" stroke-width="2" />
  <circle cx="375" cy="240" r="5" fill="#020617" stroke="#ef4444" stroke-width="2" />

  <!-- Embedded Gas Voids (Cross Section) -->
  <circle cx="395" cy="265" r="9" fill="#020617" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2" />
  <circle cx="410" cy="275" r="7" fill="#020617" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2" />

  <!-- Callout 1: Surface Pinholes -->
  <line x1="415" y1="210" x2="520" y2="140" stroke="#ef4444" stroke-width="2" />
  <circle cx="520" cy="140" r="4" fill="#ef4444" />
  <rect x="525" y="115" width="220" height="50" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" rx="6" />
  <text x="535" y="135" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Lubang Jarum (Pinholes)</text>
  <text x="535" y="153" fill="#94a3b8" font-family="sans-serif" font-size="11">Gas terjebak di permukaan</text>

  <!-- Callout 2: Internal Voids -->
  <line x1="395" y1="265" x2="250" y2="180" stroke="#ef4444" stroke-width="2" />
  <circle cx="250" cy="180" r="4" fill="#ef4444" />
  <rect x="60" y="155" width="185" height="50" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" rx="6" />
  <text x="70" y="175" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Rongga Gas Dalam</text>
  <text x="70" y="193" fill="#94a3b8" font-family="sans-serif" font-size="11">Pelindung gas terganggu</text>

  <!-- Footer Banner -->
  <rect x="40" y="390" width="720" height="30" fill="rgba(0,0,0,0.4)" rx="6" />
  <text x="400" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Penyebab: Plat kotor / berminyak, elektroda lembab, atau angin mengganggu shielding gas.
  </text>
</svg>
