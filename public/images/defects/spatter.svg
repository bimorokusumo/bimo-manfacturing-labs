<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weldBead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="2" rx="12" />

  <!-- Header Banner -->
  <rect x="40" y="40" width="720" height="50" fill="#1e1e2e" rx="8" />
  <circle cx="65" cy="65" r="8" fill="#f59e0b" filter="url(#glow)" />
  <text x="85" y="72" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    CACAT LAS: SPATTER (PERCIKAN LAS)
  </text>

  <!-- Steel Base Plates -->
  <rect x="60" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />
  <rect x="420" y="260" width="320" height="110" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" rx="4" />

  <!-- Weld Bead Layer -->
  <path d="M 350 260 Q 400 180 450 260 Q 400 280 350 260 Z" fill="url(#weldBead)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Glowing Molten Spatter Droplets scattered around base plates -->
  <circle cx="150" cy="275" r="6" fill="#f59e0b" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="210" cy="245" r="8" fill="#f97316" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="280" cy="235" r="7" fill="#f59e0b" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="310" cy="270" r="5" fill="#fbbf24" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)" />
  
  <circle cx="490" cy="265" r="9" fill="#f59e0b" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="530" cy="230" r="7" fill="#f97316" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="610" cy="275" r="8" fill="#f59e0b" stroke="#ef4444" stroke-width="2" filter="url(#glow)" />
  <circle cx="670" cy="250" r="6" fill="#fbbf24" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)" />

  <!-- Spark Rays -->
  <path d="M 210 245 L 195 230 M 210 245 L 225 235 M 490 265 L 505 250 M 490 265 L 480 250" stroke="#fef08a" stroke-width="2" />

  <!-- Callout 1: Left Spatter Cluster -->
  <line x1="210" y1="245" x2="160" y2="150" stroke="#f59e0b" stroke-width="2" />
  <circle cx="160" cy="150" r="4" fill="#f59e0b" />
  <rect x="50" y="125" width="200" height="50" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" rx="6" />
  <text x="60" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Percikan Logam Menempel</text>
  <text x="60" y="163" fill="#94a3b8" font-family="sans-serif" font-size="11">Jarak busur terlalu panjang</text>

  <!-- Callout 2: Right Spatter Cluster -->
  <line x1="490" y1="265" x2="600" y2="150" stroke="#f59e0b" stroke-width="2" />
  <circle cx="600" cy="150" r="4" fill="#f59e0b" />
  <rect x="580" y="125" width="180" height="50" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" rx="6" />
  <text x="590" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Butiran Logam Cair</text>
  <text x="590" y="163" fill="#94a3b8" font-family="sans-serif" font-size="11">Voltase / Ampere tak seimbang</text>

  <!-- Footer Banner -->
  <rect x="40" y="390" width="720" height="30" fill="rgba(0,0,0,0.4)" rx="6" />
  <text x="400" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Penyebab: Arc length terlalu panjang (jarak elektroda jauh) atau voltase terlalu tinggi.
  </text>
</svg>
