<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="weldBead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="2" rx="12" />

  <!-- Header Banner -->
  <rect x="40" y="40" width="720" height="50" fill="#1e1e2e" rx="8" />
  <circle cx="65" cy="65" r="8" fill="#ef4444" filter="url(#glow)" />
  <text x="85" y="72" fill="#ef4444" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
    CACAT LAS: UNDERCUT
  </text>

  <!-- Base Plates with Carved Undercut Notches at Weld Toe -->
  <!-- Left Plate with notch -->
  <path d="M 60 260 L 330 260 C 340 285, 350 285, 360 260 L 360 370 L 60 370 Z" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" />
  <!-- Right Plate with notch -->
  <path d="M 440 260 C 450 285, 460 285, 470 260 L 740 260 L 740 370 L 440 370 Z" fill="url(#metalPlate)" stroke="#64748b" stroke-width="2" />

  <!-- Weld Bead Filler -->
  <path d="M 360 260 Q 400 185 440 260 Q 400 275 360 260 Z" fill="url(#weldBead)" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Weld Ripples -->
  <path d="M 375 240 C 390 228, 410 228, 425 240" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  <path d="M 380 222 C 392 214, 408 214, 420 222" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />

  <!-- Highlighted Undercut Groove Notches -->
  <path d="M 330 260 C 340 285, 350 285, 360 260" fill="none" stroke="#ef4444" stroke-width="5" filter="url(#glow)" />
  <path d="M 440 260 C 450 285, 460 285, 470 260" fill="none" stroke="#ef4444" stroke-width="5" filter="url(#glow)" />

  <!-- Callout 1: Left Undercut -->
  <line x1="345" y1="275" x2="230" y2="160" stroke="#ef4444" stroke-width="2" />
  <circle cx="230" cy="160" r="4" fill="#ef4444" />
  <rect x="50" y="135" width="175" height="50" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" rx="6" />
  <text x="60" y="155" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Parit / Cerukan Kaki Las</text>
  <text x="60" y="173" fill="#94a3b8" font-family="sans-serif" font-size="11">Base metal terkeruk &amp; habis</text>

  <!-- Callout 2: Right Undercut -->
  <line x1="455" y1="275" x2="570" y2="160" stroke="#ef4444" stroke-width="2" />
  <circle cx="570" cy="160" r="4" fill="#ef4444" />
  <rect x="575" y="135" width="175" height="50" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" rx="6" />
  <text x="585" y="155" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Undercut Toe Kanan</text>
  <text x="585" y="173" fill="#94a3b8" font-family="sans-serif" font-size="11">Arus (Ampere) terlalu tinggi</text>

  <!-- Footer Banner -->
  <rect x="40" y="390" width="720" height="30" fill="rgba(0,0,0,0.4)" rx="6" />
  <text x="400" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Penyebab: Ampere terlalu tinggi atau kecepatan obor las terlalu cepat.
  </text>
</svg>
